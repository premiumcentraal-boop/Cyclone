# Copy this table into a trusted project's .codex/config.toml and replace the cwd.
# CYCLONE_DEVICE_GATEWAY_TOKEN and CYCLONE_DEVICE_GATEWAY_URL are read from the local environment.
[mcp_servers.cyclone-phone]
command = "python"
args = ["-m", "cyclone_phone_mcp"]
cwd = "C:\\path\\to\\Cyclone\\tools\\codex-phone-mcp"
env_vars = ["CYCLONE_DEVICE_GATEWAY_TOKEN", "CYCLONE_DEVICE_GATEWAY_URL"]
enabled = true
required = true
default_tools_approval_mode = "writes"
tool_timeout_sec = 60
