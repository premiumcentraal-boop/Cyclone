# Cyclone V5 alpha.109 dev2: screen reads that hold, and the approval review judges only what a tap does on the page it lands on (the control that takes the touch, in the window on top). Status-bar ticks no longer throw away screen reads, a changed read is retried in place, and a declined approval no longer ends the whole task. Glass 1.0.0-alpha.60.
# Owner-requested developer candidate; physical phone and Windows PC acceptance remain UNVERIFIED until tested.
schema = 1
product_version = "5.0.0-alpha.109.dev2"
channel = "development"
android_version_code = 255
python_version = "5.0.0-alpha.109.dev2"

[components]
mobile = "5.0.0-alpha.109.dev2"
# The retired Cyclone One desktop window (plan 31): source kept, no longer built. Cyclone for Windows ships as
# Cyclone-PC-<product_version>.zip (runtime + Glass + the cyclone command).
pc_companion = "1.6.0-alpha.43"
# Cyclone Glass web app (apps/glass). Its own line.
glass = "1.0.0-alpha.60"
device_gateway = "5.0.0-alpha.109.dev2"
mcp = "5.0.0-alpha.109.dev2"

[release]
previous_mobile_version = "4.8.0"
# Publication is authorized only through the paired V5 publisher after signed
# artifact provenance and separate named physical acceptance are verified.
publication_authorized = true
physical_pixel8 = "UNVERIFIED"
physical_pixel8_ui_acceptance = "UNVERIFIED"
android_signing = "ROTATED_UPDATE_COMPATIBLE_KEY_REQUIRED"
windows_signing = "CI_UNSIGNED"
