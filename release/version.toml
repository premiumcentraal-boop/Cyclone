# Cyclone V5 alpha.87 dev1: Phone care - Glass updates Cyclone on the phone from the PC (this release's verified APK, adb install -r, Android's errors in plain words), a busy phone is PHONE_APP_BUSY instead of disconnected (lighter accessibility event handling, a main-thread watchdog, the phone answers busy), and Glass says why Cyclone stopped (Android's exit records and the freezes it caught); plus MRZ Studio discovery in Connections (PR 197). Glass 1.0.0-alpha.48; runtime 5.0.0-alpha.87.dev1.
