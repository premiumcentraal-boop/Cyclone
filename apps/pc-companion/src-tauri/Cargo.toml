[package]
name = "cyclone-pc-companion"
version = "1.0.0-alpha.1"
description = "Cyclone PC Companion"
authors = ["Cyclone"]
edition = "2021"

[lib]
name = "cyclone_pc_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
