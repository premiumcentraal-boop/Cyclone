name: cyclone

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../apps/cyclone-core/db/init.sql:/docker-entrypoint-initdb.d/001-cyclone-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [cyclone_private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [cyclone_private]

  # One-shot: aligns the Hermes gateway's default inference provider with the
  # model credentials in .env before the gateway starts. DeepSeek key present
  # -> DeepSeek native API with deepseek-v4-flash default; otherwise
  # OpenRouter. Runs on every `docker compose up` and is idempotent. A later
  # `hermes boot` chowns config.yaml back to the runtime user.
  hermes-config:
    image: nousresearch/hermes-agent:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -n "$${DEEPSEEK_API_KEY:-}" ]; then
          echo "[cyclone] DeepSeek credentials found; configuring DeepSeek as the default provider."
          /opt/hermes/bin/hermes config set model.provider deepseek
          /opt/hermes/bin/hermes config set model.base_url https://api.deepseek.com/v1
          current=$$(/opt/hermes/bin/hermes config get model.default 2>/dev/null | tail -n 1)
          case "$$current" in
            ""|"anthropic/claude-opus-4.6")
              /opt/hermes/bin/hermes config set model.default deepseek/deepseek-v4-flash
              ;;
            *)
              echo "[cyclone] preserving operator-chosen model.default: $$current"
              ;;
          esac
        elif [ -n "$${OPENROUTER_API_KEY:-}" ]; then
          echo "[cyclone] OpenRouter credentials found; configuring OpenRouter as the default provider."
          /opt/hermes/bin/hermes config set model.provider openrouter
          /opt/hermes/bin/hermes config set model.base_url https://openrouter.ai/api/v1
        else
          echo "[cyclone] No model credentials found; leaving Hermes defaults untouched."
        fi
    environment:
      HERMES_HOME: /opt/data
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - hermes_data:/opt/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [cyclone_private]

  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY in .env}
      API_SERVER_CORS_ORIGINS: ""
      # Passed only when a developer explicitly adds it to untracked .env.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # No TELEGRAM_* env here: the Hermes gateway's own Telegram platform must
      # stay disabled — Cyclone Core owns the remote channel (TelegramWorker).
    volumes:
      - hermes_data:/opt/data
      - ${CYCLONE_WORKSPACE_HOST_PATH:?set CYCLONE_WORKSPACE_HOST_PATH in .env}:/workspace
      - ${CYCLONE_VAULT_HOST_PATH:?set CYCLONE_VAULT_HOST_PATH in .env}:/vault
    shm_size: 1gb
    depends_on:
      hermes-config:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 30s
    networks: [cyclone_private]

  cyclone-core:
    build:
      context: ../apps/cyclone-core
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CYCLONE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CYCLONE_REDIS_URL: redis://redis:6379/0
      CYCLONE_HERMES_BASE_URL: http://hermes:8642
      CYCLONE_HERMES_API_KEY: ${HERMES_API_KEY:?set HERMES_API_KEY in .env}
      CYCLONE_INTERNAL_API_KEY: ${CYCLONE_INTERNAL_API_KEY:?set CYCLONE_INTERNAL_API_KEY in .env}
      CYCLONE_HOST_BRIDGE_TOKEN: ${CYCLONE_HOST_BRIDGE_TOKEN:?set CYCLONE_HOST_BRIDGE_TOKEN in .env}
      CYCLONE_VAULT_PATH: /vault
      CYCLONE_WORKSPACE_PATH: /workspace
      CYCLONE_CORS_ORIGINS: http://127.0.0.1:1420,http://localhost:1420
      # Telegram channel for the Cyclone agent mesh (the Hermes gateway's own
      # Telegram platform stays disabled — Cyclone owns the remote channel).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      TELEGRAM_HOME_CHANNEL: ${TELEGRAM_HOME_CHANNEL:-}
    volumes:
      - ${CYCLONE_WORKSPACE_HOST_PATH:?set CYCLONE_WORKSPACE_HOST_PATH in .env}:/workspace
      - ${CYCLONE_VAULT_HOST_PATH:?set CYCLONE_VAULT_HOST_PATH in .env}:/vault
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hermes:
        condition: service_started
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [cyclone_private]

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.34.5
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:?set N8N_USER_MANAGEMENT_JWT_SECRET in .env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      TZ: ${TZ:-Europe/Amsterdam}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Amsterdam}
      CYCLONE_CORE_INTERNAL_URL: ${CYCLONE_CORE_INTERNAL_URL:-http://cyclone-core:8787}
      CYCLONE_INTERNAL_API_KEY: ${CYCLONE_INTERNAL_API_KEY:?set CYCLONE_INTERNAL_API_KEY in .env}
    volumes:
      - n8n_data:/home/node/.n8n
      - ${CYCLONE_WORKSPACE_HOST_PATH:?set CYCLONE_WORKSPACE_HOST_PATH in .env}:/workspace
      - ../services/n8n:/cyclone-n8n:ro
    depends_on:
      postgres:
        condition: service_healthy
      cyclone-core:
        condition: service_started
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://127.0.0.1:5678/healthz || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [cyclone_private]

networks:
  cyclone_private:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  redis_data:
  hermes_data:
  n8n_data:
