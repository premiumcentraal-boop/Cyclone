# Optional Cyclone Mobile Gateway overlay.
#
# Usage:
#   docker compose --env-file .env \
#     -f docker/docker-compose.yml \
#     -f docker/docker-compose.mobile.yml up -d mobile-gateway
#
# Mobilerun Portal remains a separately installed Android companion app.
# CYCLONE_MOBILERUN_PORTAL_URL should normally be the phone's LAN URL,
# e.g. http://192.168.1.42:8080.  Never commit the Portal token.

services:
  mobile-gateway:
    build:
      context: ../apps/cyclone-core
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "app.mobile_gateway:app", "--host", "0.0.0.0", "--port", "8790"]
    environment:
      CYCLONE_INTERNAL_API_KEY: ${CYCLONE_INTERNAL_API_KEY:?set CYCLONE_INTERNAL_API_KEY in .env}
      CYCLONE_MOBILERUN_PORTAL_URL: ${CYCLONE_MOBILERUN_PORTAL_URL:?set CYCLONE_MOBILERUN_PORTAL_URL in .env}
      CYCLONE_MOBILERUN_PORTAL_TOKEN: ${CYCLONE_MOBILERUN_PORTAL_TOKEN:?set CYCLONE_MOBILERUN_PORTAL_TOKEN in .env}
      # The settings model still validates its normal defaults, but this
      # gateway intentionally does not connect to Postgres/Redis/Hermes.
      CYCLONE_ENVIRONMENT: ${CYCLONE_ENVIRONMENT:-development}
    ports:
      - "127.0.0.1:8790:8790"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=5).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [cyclone_private]
