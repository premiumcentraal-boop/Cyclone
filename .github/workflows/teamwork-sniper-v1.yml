name: Teamwork Sniper V1

on:
  push:
    branches:
      - release/teamwork-sniper-v1
    paths:
      - "apps/teamwork-sniper/**"
      - "scripts/ci/teamwork_sniper_*"
      - ".github/workflows/teamwork-sniper-v1.yml"
      - "release/version.toml"

permissions:
  contents: write

concurrency:
  group: teamwork-sniper-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify V1
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Prepare Gradle wrapper
        run: chmod +x apps/mobile/gradlew

      - name: Verify Teamwork Sniper metadata
        run: python scripts/ci/teamwork_sniper_metadata.py --require-app

      - name: Verify Teamwork Sniper safety guard
        run: python scripts/ci/teamwork_sniper_guard.py --require-app

      - name: Run unit tests
        run: ./apps/mobile/gradlew -p apps/teamwork-sniper :app:testDebugUnitTest --stacktrace

      - name: Build installable V1 APK
        run: ./apps/mobile/gradlew -p apps/teamwork-sniper :app:assembleRelease --stacktrace

      - name: Prepare canonical V1 release file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/teamwork-sniper/app/build/outputs/apk/release/app-release.apk dist/Teamwork-Sniper-V1.apk
          python - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path("dist/Teamwork-Sniper-V1.apk")
          pathlib.Path("dist/Teamwork-Sniper-V1.apk.sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n")
          PY
          printf '%s\n' "${GITHUB_SHA}" > dist/source-sha.txt

      - name: Build clean-install compatibility APK
        run: ./apps/mobile/gradlew -p apps/teamwork-sniper -PteamworkSniperCleanInstall=true :app:assembleRelease --stacktrace

      - name: Prepare clean-install APK
        shell: bash
        run: |
          set -euo pipefail
          cp apps/teamwork-sniper/app/build/outputs/apk/release/app-release.apk dist/Teamwork-Sniper-V1-Clean.apk
          python - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path("dist/Teamwork-Sniper-V1-Clean.apk")
          pathlib.Path("dist/Teamwork-Sniper-V1-Clean.apk.sha256").write_text(hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n")
          PY

      - name: Verify APK signatures, manifests and alignment
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          echo "Using build tools: $BUILD_TOOLS"

          APK="$PWD/dist/Teamwork-Sniper-V1.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/apk-badging.txt
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          grep -q "package: name='com.cyclone.teamworksniper'" dist/apk-badging.txt
          grep -q "sdkVersion:'34'" dist/apk-badging.txt
          grep -q "targetSdkVersion:'35'" dist/apk-badging.txt

          CLEAN="$PWD/dist/Teamwork-Sniper-V1-Clean.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$CLEAN"
          "$BUILD_TOOLS/aapt" dump badging "$CLEAN" | tee dist/apk-clean-badging.txt
          "$BUILD_TOOLS/zipalign" -c -v 4 "$CLEAN"
          grep -q "package: name='com.cyclone.teamworksniper.v1'" dist/apk-clean-badging.txt
          grep -q "sdkVersion:'34'" dist/apk-clean-badging.txt
          grep -q "targetSdkVersion:'35'" dist/apk-clean-badging.txt

      - name: Install APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -e
            adb install -r "$GITHUB_WORKSPACE/dist/Teamwork-Sniper-V1.apk"
            adb shell pm path com.cyclone.teamworksniper
            adb shell dumpsys package com.cyclone.teamworksniper | grep -E "versionCode|versionName" | head
            adb shell am start -W -n com.cyclone.teamworksniper/com.cyclone.teamworksniper.MainActivity

            adb install -r "$GITHUB_WORKSPACE/dist/Teamwork-Sniper-V1-Clean.apk"
            adb shell pm path com.cyclone.teamworksniper.v1
            adb shell dumpsys package com.cyclone.teamworksniper.v1 | grep -E "versionCode|versionName" | head
            adb shell am start -W -n com.cyclone.teamworksniper.v1/com.cyclone.teamworksniper.MainActivity

      - name: Upload V1 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Teamwork-Sniper-V1
          path: |
            dist/Teamwork-Sniper-V1.apk
            dist/Teamwork-Sniper-V1.apk.sha256
            dist/Teamwork-Sniper-V1-Clean.apk
            dist/Teamwork-Sniper-V1-Clean.apk.sha256
            dist/source-sha.txt
            dist/apk-badging.txt
            dist/apk-clean-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub V1 beta
        if: ${{ contains(github.event.head_commit.message, 'publish beta legacy') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # Teamwork Sniper V1 Beta 1

          Installability-focused beta of the redesigned Teamwork Sniper app.

          ## Visual overhaul
          - new orange Teamwork Sniper identity
          - polished Welcome and Quick Setup onboarding
          - native weekly schedule as the primary screen
          - hollow orange = available to select
          - filled orange = selected for sniping
          - evidence-backed Claimed and Open now states
          - Activity timeline
          - simplified Settings
          - Shift Templates, Overlay Preview and Diagnostics subpages
          - Teamwork launch shortcut
          - new app icon

          ## Runtime
          The existing deterministic-first Teamwork Sniper runtime remains authoritative. The visual redesign does not add a second rule or claim engine.

          ## Verification boundary
          Both attached APKs passed repository metadata/safety gates, JVM unit tests, signature/manifest/alignment checks, and an actual Android emulator install + launch gate in GitHub Actions.

          If an earlier Teamwork Sniper package/signature state caused Android to show "App not installed", use **Teamwork-Sniper-V1-Clean.apk** first. It uses the clean package id `com.cyclone.teamworksniper.v1`.

          A successful CI build is not proof of a successful live Teamwork claim. Real claim behavior still requires physical testing against Teamwork.
          EOF

          if gh release view teamwork-sniper-v1-beta.1 >/dev/null 2>&1; then
            gh release delete teamwork-sniper-v1-beta.1 --cleanup-tag --yes
          fi

          gh release create teamwork-sniper-v1-beta.1 --target "${GITHUB_SHA}" --prerelease --title "Teamwork Sniper V1 Beta 1" --notes-file release-notes.md dist/Teamwork-Sniper-V1.apk dist/Teamwork-Sniper-V1.apk.sha256 dist/Teamwork-Sniper-V1-Clean.apk dist/Teamwork-Sniper-V1-Clean.apk.sha256 dist/source-sha.txt
