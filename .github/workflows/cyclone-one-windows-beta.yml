name: Cyclone One Windows Beta

on:
  push:
    branches: ['release/cyclone-one-v0.2.1', 'grok/cyclone-one-v0.2.1-beta']
    paths:
      - 'apps/mobile/**'
      - 'apps/device-gateway/**'
      - 'tools/cyclone-agent-mcp/**'
      - 'tools/codex-phone-mcp/**'
      - 'apps/pc-companion/**'
      - 'packaging/pc-companion/**'
      - 'scripts/pc-companion/**'
      - 'scripts/ci/**'
      - 'release/version.toml'
      - '.github/workflows/pc-companion-release.yml'
      - '.github/workflows/cyclone-one-windows-beta.yml'
      - '.github/workflows/_mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cyclone-one-v0.2.1-windows-beta
  cancel-in-progress: true

jobs:
  android-gate:
    name: Android execution gateway
    uses: ./.github/workflows/_mobile-build.yml
    with:
      allow_independent_pc_version: true
    permissions:
      contents: read

  build-and-publish-beta:
    name: Build and publish Windows beta
    needs: [android-gate]
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'

      - name: Validate gateway, MCP and execution-gateway smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -e 'apps/device-gateway[test]' -e 'tools/cyclone-agent-mcp[test]' -e tools/codex-phone-mcp
          python scripts/ci/release_versions.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q apps/device-gateway/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tools/cyclone-agent-mcp/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/codex-phone-mcp/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/pc-companion/smoke-android-execution-gateway.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/repository_security_guard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/pc-companion/package-lock.json

      - name: Verify Cyclone One v0.2.1 beta identity
        shell: pwsh
        run: |
          $Package = Get-Content 'apps/pc-companion/package.json' | ConvertFrom-Json
          $Tauri = Get-Content 'apps/pc-companion/src-tauri/tauri.conf.json' | ConvertFrom-Json
          if ($Package.version -ne '0.2.1') { throw "Unexpected package version: $($Package.version)" }
          if ($Tauri.productName -ne 'Cyclone One') { throw "Unexpected product name: $($Tauri.productName)" }
          if ($Tauri.version -ne '0.2.1') { throw "Unexpected Tauri version: $($Tauri.version)" }
          if ($Tauri.identifier -ne 'com.cyclone.one') { throw "Unexpected Tauri identifier: $($Tauri.identifier)" }

      - name: Test and compile frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/pc-companion
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build frozen Cyclone sidecars
        shell: pwsh
        run: ./scripts/pc-companion/build-sidecars.ps1

      - name: Check Rust shell with staged sidecars
        shell: pwsh
        run: |
          cargo check --manifest-path apps/pc-companion/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Cyclone One NSIS beta installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/pc-companion
          npm run tauri build -- --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Stage beta installer
        shell: pwsh
        run: |
          $Installer = Get-ChildItem 'apps/pc-companion/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if ($null -eq $Installer) { throw 'Cyclone One NSIS installer was not produced.' }
          New-Item -ItemType Directory -Force -Path dist/cyclone-one-beta | Out-Null
          Copy-Item $Installer.FullName 'dist/cyclone-one-beta/Cyclone-One-0.2.1-Beta-1-Setup.exe' -Force

      - name: Sign Windows beta when credentials are configured
        shell: pwsh
        env:
          CYCLONE_WINDOWS_SIGN_PFX_BASE64: ${{ secrets.CYCLONE_WINDOWS_SIGN_PFX_BASE64 }}
          CYCLONE_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.CYCLONE_WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          ./scripts/pc-companion/sign-artifacts.ps1 -ArtifactDirectory dist/cyclone-one-beta
          if (-not [string]::IsNullOrWhiteSpace($env:CYCLONE_WINDOWS_SIGN_PFX_BASE64) -and -not [string]::IsNullOrWhiteSpace($env:CYCLONE_WINDOWS_SIGN_PFX_PASSWORD)) {
            'WINDOWS_CODE_SIGNED' | Set-Content -NoNewline 'dist/cyclone-one-beta/windows-signing-state.txt'
          } else {
            'UNSIGNED_WINDOWS_INSTALLER' | Set-Content -NoNewline 'dist/cyclone-one-beta/windows-signing-state.txt'
          }

      - name: Generate beta provenance and notices
        shell: pwsh
        run: |
          python scripts/pc-companion/generate-third-party-notices.py --lock packaging/pc-companion/third-party-binaries.lock.json --output dist/cyclone-one-beta/THIRD_PARTY_NOTICES
          python scripts/pc-companion/generate-release-metadata.py --artifact-dir dist/cyclone-one-beta --source-sha '${{ github.sha }}' --version 0.2.1-beta --product 'Cyclone One' --third-party-lock packaging/pc-companion/third-party-binaries.lock.json

      - name: Upload exact Windows beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyclone-One-0.2.1-Beta-1
          path: dist/cyclone-one-beta/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub beta prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Tag = 'cyclone-one-v0.2.1-beta.1'
          gh release view $Tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "$Tag already exists; beta releases are immutable." }
          $SigningState = (Get-Content 'dist/cyclone-one-beta/windows-signing-state.txt' -Raw).Trim()
          $Notes = Get-Content 'docs/RELEASE_CYCLONE_ONE_0.2.1.md' -Raw
          $Notes = $Notes + "`n`nWindows signing state: $SigningState`nSource SHA: $env:GITHUB_SHA`n"
          $NotesPath = Join-Path $env:RUNNER_TEMP 'cyclone-one-beta-notes.md'
          Set-Content -Path $NotesPath -Value $Notes -Encoding utf8
          gh release create $Tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Cyclone One v0.2.1 Beta 1' --notes-file $NotesPath --prerelease `
            'dist/cyclone-one-beta/Cyclone-One-0.2.1-Beta-1-Setup.exe' `
            'dist/cyclone-one-beta/SHA256SUMS.txt' `
            'dist/cyclone-one-beta/source-sha.txt' `
            'dist/cyclone-one-beta/release-provenance.json' `
            'dist/cyclone-one-beta/windows-signing-state.txt' `
            'dist/cyclone-one-beta/THIRD_PARTY_NOTICES'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
