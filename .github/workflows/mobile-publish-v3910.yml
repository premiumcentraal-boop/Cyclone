name: Cyclone Mobile Release Repair

on:
  push:
    branches: ['repair/cyclone-v4.0.1-signing']
    paths:
      - 'apps/mobile/**'
      - 'apps/device-gateway/**'
      - 'tools/codex-phone-mcp/**'
      - 'tools/cyclone-agent-mcp/**'
      - 'scripts/ci/**'
      - 'scripts/phone-gateway/**'
      - 'release/version.toml'
      - '.github/workflows/_mobile-build.yml'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/mobile-publish-v3910.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: mobile-full-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    environment: mobile-release-approval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate exact existing release and successful CI
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/34115419356" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v4.0.1" > "$RUNNER_TEMP/release-before.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v4.0.1" > "$RUNNER_TEMP/tag.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root/'source-run.json').read_text())
          release = json.loads((root/'release-before.json').read_text())
          tag = json.loads((root/'tag.json').read_text())
          sha = '44446e4b6fa18833670a1eafe7803b1a9490375c'
          assert run['head_sha'] == tag['object']['sha'] == sha
          assert run['name'] == 'Cyclone Mobile CI' and run['path'] == '.github/workflows/mobile-ci.yml'
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['event'] == 'push' and run['conclusion'] == 'success'
          original = next(a for a in release['assets'] if a['name'] == 'Cyclone-4.0.1.apk')
          assert original['digest'] == 'sha256:8216b89773a5ba76f69c76fea49e51137f42d8142198e9ae5376ead5cf10d6a4'
          assert not any(a['name'] == 'Cyclone-4.0.1-signed.apk' for a in release['assets'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version=4.0.1\nprevious=3.9.12\ncode=72\n')
          PY

      - name: Download authoritative unsigned CI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Cyclone-Android-${{ steps.version.outputs.version }}
          run-id: 34115419356
          github-token: ${{ github.token }}
          path: candidate

      - name: Verify checksum, identity and provenance
        id: candidate
        shell: bash
        env:
          EXPECTED_RUN_ID: 34115419356
        run: |
          set -euo pipefail
          test -s candidate/source-sha.txt
          test -s candidate/run-id.txt
          test -s candidate/mobile-metadata.json
          test -s candidate/signing-state.txt
          test "$(tr -d '\r\n' < candidate/source-sha.txt)" = "44446e4b6fa18833670a1eafe7803b1a9490375c"
          test "$(tr -d '\r\n' < candidate/run-id.txt)" = "$EXPECTED_RUN_ID"
          test "$(tr -d '\r\n' < candidate/signing-state.txt)" = "UNSIGNED_VERIFIED_CANDIDATE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('candidate')
          metadata = json.loads((root / 'mobile-metadata.json').read_text())
          assert metadata['artifact_name'] == 'Cyclone-Android-${{ steps.version.outputs.version }}'
          assert metadata['application_id'] == 'com.cyclone.mobile'
          assert metadata['version_name'] == '${{ steps.version.outputs.version }}'
          assert int(metadata['version_code']) == ${{ steps.version.outputs.code }}
          assert metadata['apk_name'] == 'Cyclone-${{ steps.version.outputs.version }}.apk'
          assert (root / metadata['apk_name']).is_file()
          assert len(list(root.glob('*.apk'))) == 1
          PY
          (cd candidate && sha256sum --check Cyclone-${{ steps.version.outputs.version }}.apk.sha256)
          echo '8216b89773a5ba76f69c76fea49e51137f42d8142198e9ae5376ead5cf10d6a4  candidate/Cyclone-4.0.1.apk' | sha256sum --check

      - name: Set up Android signing tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build tools
        shell: bash
        run: sdkmanager --install 'build-tools;35.0.0'

      - name: Recover update-compatible personal-development signer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          legacy_ref='release/cyclone-mobile-v3.9.0'
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/release.keystore.b64?ref=$legacy_ref" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/release.keystore.b64"
          base64 --decode "$RUNNER_TEMP/release.keystore.b64" > "$RUNNER_TEMP/release.keystore"
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/app/build.gradle.kts?ref=$legacy_ref" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/legacy.gradle.kts"
          python3 - "$RUNNER_TEMP/legacy.gradle.kts" "$RUNNER_TEMP/legacy-signing.env" <<'PY'
          import re, shlex, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          match = re.search(r'create\("ciRelease"\)\s*\{(?P<body>.*?)\n\s*\}', text, re.S)
          if not match:
              raise SystemExit('legacy ciRelease signing block not found')
          body = match.group('body')
          def value(name):
              found = re.search(rf'{name}\s*=\s*"([^"]+)"', body)
              if not found:
                  raise SystemExit(f'legacy {name} not found')
              return found.group(1)
          with open(sys.argv[2], 'w', encoding='utf-8') as out:
              out.write('STORE_PASSWORD=' + shlex.quote(value('storePassword')) + '\n')
              out.write('KEY_ALIAS=' + shlex.quote(value('keyAlias')) + '\n')
              out.write('KEY_PASSWORD=' + shlex.quote(value('keyPassword')) + '\n')
          PY
          chmod 600 "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/legacy-signing.env"

      - name: Sign and verify update continuity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/legacy-signing.env"
          export STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          mkdir -p signed "$RUNNER_TEMP/previous"
          input='candidate/Cyclone-${{ steps.version.outputs.version }}.apk'
          output='signed/Cyclone-${{ steps.version.outputs.version }}-signed.apk'
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false \
            --out "$output" \
            "$input"
          "$apksigner" verify --min-sdk-version 34 --verbose --print-certs "$output" | tee signed/signing-info.txt
          "$aapt" dump badging "$output" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.cyclone.mobile'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='${{ steps.version.outputs.code }}'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='${{ steps.version.outputs.version }}'" "$RUNNER_TEMP/badging.txt"
          if grep -Eq 'testOnly[= ]true' "$RUNNER_TEMP/badging.txt"; then
            echo 'ERROR: signed release APK is testOnly.' >&2
            exit 1
          fi

          gh release download v${{ steps.version.outputs.previous }} --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cyclone-${{ steps.version.outputs.previous }}.apk' --dir "$RUNNER_TEMP/previous"
          previous_cert="$("$apksigner" verify --min-sdk-version 34 --print-certs "$RUNNER_TEMP/previous/Cyclone-${{ steps.version.outputs.previous }}.apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          current_cert="$("$apksigner" verify --min-sdk-version 34 --print-certs "$output" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$previous_cert"
          test "$current_cert" = "$previous_cert"

          (cd signed && sha256sum Cyclone-${{ steps.version.outputs.version }}-signed.apk > Cyclone-${{ steps.version.outputs.version }}-signed.apk.sha256)
          printf '%s\n' 'Signed with the historical ${{ steps.version.outputs.previous }}-compatible development key. Signature equality with ${{ steps.version.outputs.previous }} was verified. This signer is update-compatible but not production-secure.' > signed/update-compatibility.txt
          cp candidate/source-sha.txt candidate/run-id.txt candidate/mobile-metadata.json signed/
          printf '%s\n' 'SIGNED_LEGACY_UPDATE_COMPATIBILITY_KEY_FULL_RELEASE' > signed/signed-signing-state.txt

      - name: Destroy recovered signing material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/release.keystore" \
            "$RUNNER_TEMP/release.keystore.b64" \
            "$RUNNER_TEMP/legacy.gradle.kts" \
            "$RUNNER_TEMP/legacy-signing.env" \
            "$RUNNER_TEMP/previous" \
            "$RUNNER_TEMP/badging.txt"

      - name: Verify unchanged payload and record repair evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          original = Path('candidate/Cyclone-4.0.1.apk')
          signed = Path('signed/Cyclone-4.0.1-signed.apk')
          with zipfile.ZipFile(original) as before, zipfile.ZipFile(signed) as after:
              assert set(before.namelist()) == set(after.namelist()), 'APK payload entries changed'
              for name in before.namelist():
                  assert before.read(name) == after.read(name), f'APK payload changed: {name}'
          report = dict(version_name='4.0.1', version_code=72,
              source_sha='44446e4b6fa18833670a1eafe7803b1a9490375c',
              ci_run_id=34115419356, repair_run_id=int(os.environ['GITHUB_RUN_ID']),
              repair_source_sha=os.environ['GITHUB_SHA'],
              apk_name=signed.name, apk_size=signed.stat().st_size,
              apk_sha256=hashlib.sha256(signed.read_bytes()).hexdigest(),
              unsigned_apk_sha256=hashlib.sha256(original.read_bytes()).hexdigest(),
              unchanged_payload=True, signer_matches_release='v3.9.12',
              signing='LEGACY_UPDATE_COMPATIBLE_DEV_KEY', physical_device_acceptance='NOT_RUN')
          Path('signed/BUILD_VERIFIED.json').write_text(json.dumps(report, indent=2)+'\n')
          PY

      - name: Upload signed release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cyclone-Android-${{ steps.version.outputs.version }}-signed
          path: signed/
          if-no-files-found: error
          retention-days: 30

      - name: Attach installable APK and correct release guidance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v4.0.1" --jq .object.sha)" = '44446e4b6fa18833670a1eafe7803b1a9490375c'
          gh release upload v4.0.1 --repo "$GITHUB_REPOSITORY" \
            signed/Cyclone-4.0.1-signed.apk signed/Cyclone-4.0.1-signed.apk.sha256 \
            signed/signed-signing-state.txt signed/signing-info.txt signed/update-compatibility.txt signed/BUILD_VERIFIED.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP'])/'release-before.json').read_text())
          proof = json.loads(Path('signed/BUILD_VERIFIED.json').read_text())
          intro = f"""## Installable APK — release repaired

          Download **[Cyclone-4.0.1-signed.apk](https://github.com/premiumcentraal-boop/Cyclone/releases/download/v4.0.1/Cyclone-4.0.1-signed.apk)**.

          The original `Cyclone-4.0.1.apk` is an unsigned CI archive and is not installable. It is retained for provenance; use the signed download above. The original `signing-state.txt` describes that unsigned archive. `signed-signing-state.txt`, `signing-info.txt` and `BUILD_VERIFIED.json` describe the repaired installable APK.

          No app rebuild or tag movement: the payload is byte-for-byte identical to successful Mobile CI run 34115419356, source `44446e4b6fa18833670a1eafe7803b1a9490375c`, versionCode 72. The APK signature verifies and matches published v3.9.12. This is the existing personal-development signer, not rotated-key or Play signing. Protected signing secrets and physical-device testing remain separate work.

          Signed APK SHA-256: `{proof['apk_sha256']}`.
          Physical-device acceptance: **NOT RUN**.

          ---
          Original implementation notes below; statements about publication being disabled describe the earlier candidate stage.

          """
          (Path(os.environ['RUNNER_TEMP'])/'repaired-notes.md').write_text(intro+release['body'])
          PY
          gh release edit v4.0.1 --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/repaired-notes.md"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/548662656" \
            -f label='Unsigned CI archive - use Cyclone-4.0.1-signed.apk to install' >/dev/null
