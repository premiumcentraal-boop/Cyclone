name: Finalize Cyclone Mobile 3.2.0-beta.2 release notes

on:
  push:
    branches: [release/cyclone-mobile-v3.2]
    paths:
      - '.github/workflows/publish-mobile-v3.2.0-beta.2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Correct release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # Cyclone Mobile 3.2.0-beta.2

          Hotfix for the V3.2 phone setup crash.

          ## Fixed
          - Fixes the crash/termination when tapping **Finish setup** from Home.
          - Android/OEM permission-state reads now fail closed to “not enabled” instead of terminating Cyclone if a system API throws.
          - Adds regression coverage for permission-state `SecurityException` and runtime failures.

          ## Build
          - Package: `com.cyclone.mobile`
          - Version: `3.2.0-beta.2`
          - versionCode: `32`
          - Source SHA: `500455fb21341718dda63cb73c6957ccd8ccff13`
          - Cyclone Mobile CI run: `32981773559`

          ## Verification
          - Published APK is the exact artifact produced by successful Cyclone Mobile CI run `32981773559`; it was not rebuilt during release publication.
          - APK checksum and source/run provenance were verified before publication.
          - Physical-device verification remains separate from CI and should be performed by installing this APK and exercising Finish setup on hardware.
          EOF
          gh release edit v3.2.0-beta.2 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cyclone Mobile 3.2.0-beta.2" \
            --prerelease \
            --notes-file release-notes.md
