name: Cyclone Mobile Release Candidate Verification

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Cyclone Mobile CI run ID to reuse (never rebuilt)
        required: true
        type: string
      artifact_name:
        description: Exact artifact name reported by that run
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-release-${{ inputs.build_run_id }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    environment: mobile-release-approval
    runs-on: ubuntu-latest
    steps:
      - name: Validate authoritative successful build run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          test "$(jq -r '.name' <<< "$run_json")" = "Cyclone Mobile CI"
          test "$(jq -r '.path' <<< "$run_json")" = ".github/workflows/mobile-ci.yml"
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success"
          test "$(jq -r '.event' <<< "$run_json")" = "push"
          test "$(jq -r '.head_repository.full_name' <<< "$run_json")" = "$GITHUB_REPOSITORY"
          head_branch="$(jq -r '.head_branch' <<< "$run_json")"
          case "$head_branch" in
            main|release/cyclone-mobile-v*|feature/cyclone-3.5.2-beta) ;;
            *) echo "Untrusted mobile release source branch: $head_branch" >&2; exit 1 ;;
          esac
          head_sha="$(jq -r '.head_sha' <<< "$run_json")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
      - name: Download authoritative CI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify checksum and provenance
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          EXPECTED_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          test -s candidate/source-sha.txt
          test -s candidate/run-id.txt
          test -s candidate/mobile-metadata.json
          test "$(tr -d '\r\n' < candidate/source-sha.txt)" = "$EXPECTED_HEAD_SHA"
          test "$(tr -d '\r\n' < candidate/run-id.txt)" = "$EXPECTED_RUN_ID"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("candidate")
          metadata = json.loads((root / "mobile-metadata.json").read_text(encoding="utf-8"))
          apks = sorted(root.glob("*.apk"))
          assert metadata["artifact_name"] == os.environ["EXPECTED_ARTIFACT_NAME"]
          assert metadata["application_id"] == "com.cyclone.mobile"
          mobile_apk = root / metadata["apk_name"]
          assert mobile_apk.is_file(), f"missing Cyclone APK: {mobile_apk.name}"
          sniper_metadata_path = root / "teamwork-sniper-metadata.json"
          if sniper_metadata_path.is_file():
              sniper = json.loads(sniper_metadata_path.read_text(encoding="utf-8"))
              assert sniper["present"] is True
              assert sniper["application_id"] == "com.cyclone.teamworksniper"
              sniper_apk = root / sniper["apk_name"]
              assert sniper_apk.is_file(), f"missing Teamwork Sniper APK: {sniper_apk.name}"
              assert len(apks) == 2
          else:
              assert len(apks) == 1
          PY
          (cd candidate && sha256sum --check ./*.apk.sha256)
          echo "Publication is intentionally disabled; this job only verifies the reused CI artifact." >> "$GITHUB_STEP_SUMMARY"
