name: Cyclone One 1.1.3 Publish
on:
  push:
    branches: ['release/cyclone-one-v1.1.3-live-phone']
permissions:
  contents: write
  actions: read
concurrency:
  group: one-113-publication
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate authorized immutable identity
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          m=tomllib.loads(Path('release/version.toml').read_text())
          assert m['components']['pc_companion']=='1.1.3'
          assert m['components']['mobile']=='4.2.4' and m['android_version_code']==85
          assert m['release']['publication_authorized'] is True
          assert Path('docs/RELEASE_ONE_1.1.3.md').is_file()
          PY
      - name: Wait for exact green Windows candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            row="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$GITHUB_SHA" -f event=push -f per_page=100 --jq '[.workflow_runs[] | select(.path == ".github/workflows/pc-companion-release.yml")] | sort_by(.created_at) | last // empty')"
            if [[ -n "$row" ]] && [[ "$(jq -r .status <<< "$row")" == completed ]]; then
              [[ "$(jq -r .conclusion <<< "$row")" == success ]] || { echo 'Windows candidate failed'; exit 1; }
              run_id="$(jq -r .id <<< "$row")"
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "cyclone-pc-release-candidate-$GITHUB_SHA" --dir candidate
              exit 0
            fi
            sleep 15
          done
          echo 'Timed out waiting for candidate'; exit 1
      - name: Verify candidate provenance and installed acceptance
        env:
          CANDIDATE_RUN: ${{ steps.candidate.outputs.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path('candidate')
          p=json.loads((root/'release-provenance.json').read_text(encoding='utf-8-sig'))
          assert p['source_sha']==os.environ['GITHUB_SHA'] and p['version']=='1.1.3'
          assert (root/'source-sha.txt').read_text(encoding='utf-8-sig').strip()==os.environ['GITHUB_SHA']
          assert (root/'run-id.txt').read_text(encoding='utf-8-sig').strip()==os.environ['CANDIDATE_RUN']
          names=set()
          for item in p['artifacts']:
              name=item['name']; assert Path(name).name==name
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==item['sha256']
              names.add(name)
          assert {'Cyclone-PC-Companion-1.1.3-Setup.exe','CycloneLivePhone.exe','CycloneAgentMCP.exe','CyclonePCRuntime.exe'} <= names
          acceptance=json.loads((root/'installer-acceptance.json').read_text(encoding='utf-8-sig'))
          assert acceptance['installed'] and acceptance['cli_help']
          PY
          (cd candidate && sha256sum --check SHA256SUMS.txt)
      - name: Publish new One release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view one-1.1.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to overwrite one-1.1.3'; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/one-1.1.3" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing tag'; exit 1
          fi
          cp docs/RELEASE_ONE_1.1.3.md /tmp/one-notes.md
          printf '\nSource SHA: `%s`\nWindows candidate run: `%s`\n' "$GITHUB_SHA" '${{ steps.candidate.outputs.run_id }}' >> /tmp/one-notes.md
          gh release create one-1.1.3 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Cyclone One 1.1.3 — Live Phone' --notes-file /tmp/one-notes.md candidate/*.exe candidate/SHA256SUMS.txt candidate/release-provenance.json candidate/THIRD_PARTY_NOTICES candidate/source-sha.txt candidate/run-id.txt candidate/signing-state.txt candidate/installer-acceptance.json
