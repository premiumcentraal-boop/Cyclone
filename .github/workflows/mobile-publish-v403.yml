name: Cyclone Mobile 4.0.3 Layer 2 Release

on:
  push:
    branches: ['release/cyclone-mobile-v4.0.3']

permissions:
  contents: write

concurrency:
  group: cyclone-mobile-v4.0.3-layer2-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate 4.0.3 release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, tomllib
          from pathlib import Path
          meta = tomllib.loads(Path('release/version.toml').read_text())
          gradle = Path('apps/mobile/app/build.gradle.kts').read_text()
          assert meta['components']['mobile'] == '4.0.3'
          assert meta['android_version_code'] == 74
          assert meta['release']['previous_mobile_version'] == '4.0.2'
          assert meta['release']['publication_authorized'] is True
          assert re.search(r'versionCode\s*=\s*74\b', gradle)
          assert re.search(r'versionName\s*=\s*"4\.0\.3"', gradle)
          assert Path('docs/RELEASE_4.0.3.md').is_file()
          PY
          test "$GITHUB_REF_NAME" = 'release/cyclone-mobile-v4.0.3'

      - name: Refuse replacement of existing v4.0.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.0.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'ERROR: v4.0.3 already exists; refusing to replace release bytes.' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build tools
        shell: bash
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Version and product guards
        run: |
          python3 scripts/ci/release_versions.py --check
          python3 scripts/ci/mobile_product_guard.py

      - name: Layer 2 JVM safety tests
        run: ./apps/mobile/gradlew -p apps/mobile :app:testDebugUnitTest --tests 'com.cyclone.mobile.runtime.workspaces.*' --stacktrace

      - name: Full JVM regression suite
        id: regression
        continue-on-error: true
        run: ./apps/mobile/gradlew -p apps/mobile :app:testDebugUnitTest --stacktrace

      - name: Preserve JVM reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cyclone-4.0.3-jvm-reports
          path: apps/mobile/app/build/reports/tests/

      - name: Assemble release APK
        shell: bash
        run: ./apps/mobile/gradlew -p apps/mobile :app:assembleRelease --stacktrace

      - name: Prepare unsigned candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          test -s apps/mobile/app/build/outputs/apk/release/app-release-unsigned.apk
          cp apps/mobile/app/build/outputs/apk/release/app-release-unsigned.apk candidate/Cyclone-4.0.3.apk
          printf '%s\n' "$GITHUB_SHA" > candidate/source-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > candidate/run-id.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('candidate/mobile-metadata.json').write_text(json.dumps({
              'artifact_name': 'Cyclone-Android-4.0.3-workspaces',
              'application_id': 'com.cyclone.mobile',
              'version_name': '4.0.3',
              'version_code': 74,
              'apk_name': 'Cyclone-4.0.3.apk',
              'tests': 'LAYER2_JVM_PASSED',
              'full_jvm_suite': '${{ steps.regression.outcome }}',
              'physical_pixel8': 'UNVERIFIED',
              'physical_pixel8_ui_acceptance': 'UNVERIFIED',
          }, indent=2) + '\n')
          PY

      - name: Recover update-compatible development signer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          legacy_ref='release/cyclone-mobile-v3.9.0'
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/release.keystore.b64?ref=$legacy_ref" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/release.keystore.b64"
          base64 --decode "$RUNNER_TEMP/release.keystore.b64" > "$RUNNER_TEMP/release.keystore"
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/app/build.gradle.kts?ref=$legacy_ref" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/legacy.gradle.kts"
          python3 - "$RUNNER_TEMP/legacy.gradle.kts" "$RUNNER_TEMP/legacy-signing.env" <<'PY'
          import re, shlex, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          match = re.search(r'create\("ciRelease"\)\s*\{(?P<body>.*?)\n\s*\}', text, re.S)
          if not match:
              raise SystemExit('legacy ciRelease signing block not found')
          body = match.group('body')
          def value(name):
              found = re.search(rf'{name}\s*=\s*"([^"]+)"', body)
              if not found:
                  raise SystemExit(f'legacy {name} not found')
              return found.group(1)
          with open(sys.argv[2], 'w', encoding='utf-8') as out:
              out.write('STORE_PASSWORD=' + shlex.quote(value('storePassword')) + '\n')
              out.write('KEY_ALIAS=' + shlex.quote(value('keyAlias')) + '\n')
              out.write('KEY_PASSWORD=' + shlex.quote(value('keyPassword')) + '\n')
          PY
          chmod 600 "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/legacy-signing.env"

      - name: Sign and verify update compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/legacy-signing.env"
          export STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          mkdir -p signed "$RUNNER_TEMP/previous-signed"
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out signed/Cyclone-4.0.3.apk \
            candidate/Cyclone-4.0.3.apk
          "$apksigner" verify --min-sdk-version 34 --verbose --print-certs signed/Cyclone-4.0.3.apk | tee signed/signing-info.txt
          "$aapt" dump badging signed/Cyclone-4.0.3.apk | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.cyclone.mobile'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='74'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='4.0.3'" "$RUNNER_TEMP/badging.txt"
          if grep -Eq 'testOnly[= ]true' "$RUNNER_TEMP/badging.txt"; then
            echo 'ERROR: release APK is testOnly.' >&2
            exit 1
          fi

          # Preserve the v4.0.2 update-compatible signer.
          gh release download v4.0.2 --repo "$GITHUB_REPOSITORY" --pattern 'Cyclone-4.0.2.apk' --dir "$RUNNER_TEMP/previous-signed"
          previous_cert="$("$apksigner" verify --min-sdk-version 34 --print-certs "$RUNNER_TEMP/previous-signed/Cyclone-4.0.2.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          current_cert="$("$apksigner" verify --min-sdk-version 34 --print-certs signed/Cyclone-4.0.3.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$previous_cert"
          test "$current_cert" = "$previous_cert"

          (cd signed && sha256sum Cyclone-4.0.3.apk > Cyclone-4.0.3.apk.sha256)
          cp candidate/source-sha.txt candidate/run-id.txt candidate/mobile-metadata.json signed/
          printf '%s\n' 'SIGNED_LEGACY_UPDATE_COMPATIBILITY_KEY_LAYER2_JVM_VERIFIED_PHONE_UNVERIFIED' > signed/signing-state.txt
          printf '%s\n' 'Signed with the historical update-compatible development key; certificate equality with the published signed v4.0.2 APK was verified. No phone verification was performed.' > signed/update-compatibility.txt

      - name: Destroy recovered signing material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/release.keystore" \
            "$RUNNER_TEMP/release.keystore.b64" \
            "$RUNNER_TEMP/legacy.gradle.kts" \
            "$RUNNER_TEMP/legacy-signing.env" \
            "$RUNNER_TEMP/previous-signed" \
            "$RUNNER_TEMP/badging.txt"

      - name: Publish Cyclone 4.0.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd signed && sha256sum -c Cyclone-4.0.3.apk.sha256)
          test "$(cat signed/source-sha.txt)" = "$GITHUB_SHA"
          cp docs/RELEASE_4.0.3.md "$RUNNER_TEMP/release-notes.md"
          printf '\n\nSource SHA: `%s`\nCI/publish run: `%s`\n' "$(cat signed/source-sha.txt)" "$(cat signed/run-id.txt)" >> "$RUNNER_TEMP/release-notes.md"
          printf '\nLayer 2 JVM safety tests: PASSED. Full JVM regression suite: %s. NO phone testing.\n' '${{ steps.regression.outcome }}' >> "$RUNNER_TEMP/release-notes.md"
          if [ '${{ steps.regression.outcome }}' != 'success' ]; then
            printf '\nPublished with Layer 2 JVM tests and release build green; full-suite regression failures remain. This is not a full-suite-verified release.\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          gh release create v4.0.3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Cyclone 4.0.3' \
            --latest \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            signed/Cyclone-4.0.3.apk \
            signed/Cyclone-4.0.3.apk.sha256 \
            signed/source-sha.txt \
            signed/run-id.txt \
            signed/mobile-metadata.json \
            signed/signing-state.txt \
            signed/signing-info.txt \
            signed/update-compatibility.txt
