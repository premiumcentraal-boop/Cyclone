name: Cyclone Mobile Publish 4.4.9

on:
  push:
    branches: ['release/cyclone-mobile-v4.4.9']
    paths:
      - 'apps/mobile/**'
      - 'apps/device-gateway/**'
      - 'tools/codex-phone-mcp/**'
      - 'tools/cyclone-agent-mcp/**'
      - 'scripts/ci/**'
      - 'scripts/phone-gateway/**'
      - 'release/version.toml'
      - '.github/workflows/_mobile-build.yml'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/mobile-publish-v449.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: mobile-publish-v4.4.9
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse replacement of an existing 4.4.9 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v4.4.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'ERROR: v4.4.9 already exists. Release bytes are immutable; increment the version instead.' >&2
            exit 1
          fi

      - name: Verify publication authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('release/version.toml').read_text())
          assert data['product_version'] == '4.4.9'
          assert data['android_version_code'] == 109
          assert data['release']['publication_authorized'] is True
          PY

      - name: Wait for exact Mobile CI source run
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs"               -f head_sha="$GITHUB_SHA" -f event=push -f per_page=100)"
            row="$(jq -c '[.workflow_runs[] | select(.name == "Cyclone Mobile CI" and .path == ".github/workflows/mobile-ci.yml")] | sort_by(.created_at) | last // empty' <<< "$runs")"
            if [[ -n "$row" ]]; then
              status="$(jq -r '.status' <<< "$row")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$row")"
              run_id="$(jq -r '.id' <<< "$row")"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "ERROR: exact Mobile CI run $run_id finished as $conclusion" >&2
                  exit 1
                fi
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "Exact Mobile CI run $run_id succeeded for $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'ERROR: timed out waiting for exact Mobile CI run.' >&2
          exit 1

      - name: Download authoritative unsigned CI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Cyclone-Android-4.4.9
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Verify checksum, identity and provenance
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -euo pipefail
          test -s candidate/source-sha.txt
          test -s candidate/run-id.txt
          test -s candidate/mobile-metadata.json
          test -s candidate/signing-state.txt
          test "$(tr -d '\r\n' < candidate/source-sha.txt)" = "$GITHUB_SHA"
          test "$(tr -d '\r\n' < candidate/run-id.txt)" = "$EXPECTED_RUN_ID"
          test "$(tr -d '\r\n' < candidate/signing-state.txt)" = "UNSIGNED_VERIFIED_CANDIDATE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('candidate')
          metadata = json.loads((root / 'mobile-metadata.json').read_text())
          assert metadata['artifact_name'] == 'Cyclone-Android-4.4.9'
          assert metadata['application_id'] == 'com.cyclone.mobile'
          assert metadata['version_name'] == '4.4.9'
          assert int(metadata['version_code']) == 109
          assert metadata['apk_name'] == 'Cyclone-4.4.9.apk'
          assert (root / metadata['apk_name']).is_file()
          assert len(list(root.glob('*.apk'))) == 1
          PY
          (cd candidate && sha256sum --check Cyclone-4.4.9.apk.sha256)

      - name: Set up Android signing tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build tools
        shell: bash
        run: sdkmanager --install 'build-tools;35.0.0'

      - name: Recover update-compatible personal-development signer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          legacy_ref='release/cyclone-mobile-v3.9.0'
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/release.keystore.b64?ref=$legacy_ref" --jq .content             | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/release.keystore.b64"
          base64 --decode "$RUNNER_TEMP/release.keystore.b64" > "$RUNNER_TEMP/release.keystore"
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/app/build.gradle.kts?ref=$legacy_ref" --jq .content             | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/legacy.gradle.kts"
          python3 - "$RUNNER_TEMP/legacy.gradle.kts" "$RUNNER_TEMP/legacy-signing.env" <<'PY'
          import re, shlex, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          match = re.search(r'create\("ciRelease"\)\s*\{(?P<body>.*?)\n\s*\}', text, re.S)
          if not match:
              raise SystemExit('legacy ciRelease signing block not found')
          body = match.group('body')
          def value(name):
              found = re.search(rf'{name}\s*=\s*"([^"]+)"', body)
              if not found:
                  raise SystemExit(f'legacy {name} not found')
              return found.group(1)
          with open(sys.argv[2], 'w', encoding='utf-8') as out:
              out.write('STORE_PASSWORD=' + shlex.quote(value('storePassword')) + '\n')
              out.write('KEY_ALIAS=' + shlex.quote(value('keyAlias')) + '\n')
              out.write('KEY_PASSWORD=' + shlex.quote(value('keyPassword')) + '\n')
          PY
          chmod 600 "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/legacy-signing.env"

      - name: Sign and verify update continuity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/legacy-signing.env"
          export STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          mkdir -p signed "$RUNNER_TEMP/previous"
          input='candidate/Cyclone-4.4.9.apk'
          output='signed/Cyclone-4.4.9.apk'
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$apksigner" sign             --ks "$RUNNER_TEMP/release.keystore"             --ks-key-alias "$KEY_ALIAS"             --ks-pass env:STORE_PASSWORD             --key-pass env:KEY_PASSWORD             --out "$output"             "$input"
          "$apksigner" verify --min-sdk-version 34 --verbose --print-certs "$output" | tee signed/signing-info.txt
          "$aapt" dump badging "$output" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.cyclone.mobile'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='109'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='4.4.9'" "$RUNNER_TEMP/badging.txt"
          if grep -Eq 'testOnly[= ]true' "$RUNNER_TEMP/badging.txt"; then
            echo 'ERROR: signed release APK is testOnly.' >&2
            exit 1
          fi

          gh release download v4.4.8 --repo "$GITHUB_REPOSITORY"             --pattern 'Cyclone-4.4.8.apk' --dir "$RUNNER_TEMP/previous"
          previous_cert="$("$apksigner" verify --min-sdk-version 34 --print-certs "$RUNNER_TEMP/previous/Cyclone-4.4.8.apk"             | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          current_cert="$("$apksigner" verify --min-sdk-version 34 --print-certs "$output"             | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$previous_cert"
          test "$current_cert" = "$previous_cert"

          (cd signed && sha256sum Cyclone-4.4.9.apk > Cyclone-4.4.9.apk.sha256)
          cp candidate/source-sha.txt candidate/run-id.txt candidate/mobile-metadata.json signed/
          printf '%s\n' 'SIGNED_LEGACY_UPDATE_COMPATIBILITY_KEY_PERSONAL_DEV' > signed/signing-state.txt

      - name: Destroy recovered signing material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/release.keystore"             "$RUNNER_TEMP/release.keystore.b64"             "$RUNNER_TEMP/legacy.gradle.kts"             "$RUNNER_TEMP/legacy-signing.env"             "$RUNNER_TEMP/previous"             "$RUNNER_TEMP/badging.txt"

      - name: Publish immutable 4.4.9 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v4.4.9             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title 'Cyclone 4.4.9'             --notes-file docs/RELEASE_4.4.9.md             signed/Cyclone-4.4.9.apk             signed/Cyclone-4.4.9.apk.sha256             signed/source-sha.txt             signed/run-id.txt             signed/mobile-metadata.json             signed/signing-state.txt             signed/signing-info.txt
