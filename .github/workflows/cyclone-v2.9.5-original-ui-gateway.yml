name: Cyclone 2.9.5 Original UI + Full Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - release/cyclone-mobile-v2.9.5

permissions:
  contents: write

concurrency:
  group: cyclone-v2.9.5
  cancel-in-progress: true

jobs:
  pc-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway test/build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e "./apps/device-gateway[test]"
          python -m pip install -e "./tools/codex-phone-mcp"
      - name: Test PC Device Gateway
        run: python -m pytest apps/device-gateway/tests -q
      - name: Test Codex phone MCP
        run: python -m unittest discover -s tools/codex-phone-mcp/tests -v
      - name: Test mocked two-pass phone route
        run: python -m cyclone_phone_mcp.acceptance --mock
      - name: Build 2.9.5 PC wheels
        run: |
          mkdir -p dist/pc
          python -m build --wheel --outdir dist/pc apps/device-gateway
          python -m build --wheel --outdir dist/pc tools/codex-phone-mcp
          cp scripts/phone-gateway/install-windows.ps1 dist/pc/
          cp scripts/phone-gateway/first-run.ps1 dist/pc/
          cp tools/codex-phone-mcp/codex-config.example.toml dist/pc/
          cp docs/CODEX_PHONE_FIRST_RUN.md dist/pc/
      - uses: actions/upload-artifact@v4
        with:
          name: Cyclone-2.9.5-PC-Gateway
          path: dist/pc/*
          if-no-files-found: error
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify original 2.9.3 Cyclone UI is untouched
        run: |
          git diff --exit-code c3684dfe2d74836826785eccafed4b6d218cffc1 -- apps/mobile/app/src/main/java/com/cyclone/mobile/ui/CycloneMobileV292App.kt
      - name: Verify exactly one launcher activity
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('apps/mobile/app/src/main/AndroidManifest.xml')
          root = ET.parse(path).getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          launchers = []
          for activity in root.findall('./application/activity'):
              for filt in activity.findall('intent-filter'):
                  actions = {x.get(ns+'name') for x in filt.findall('action')}
                  cats = {x.get(ns+'name') for x in filt.findall('category')}
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in cats:
                      launchers.append(activity.get(ns+'name'))
          assert launchers == ['.MainActivity'], f'Expected only .MainActivity launcher, got {launchers}'
          print('Single Cyclone launcher verified:', launchers[0])
          PY
      - name: Verify 2.9.5 version and package identity
        run: |
          grep -q 'applicationId = "com.cyclone.mobile"' apps/mobile/app/build.gradle.kts
          grep -q 'versionCode = 17' apps/mobile/app/build.gradle.kts
          grep -q 'versionName = "0.11.5-v2.9.5"' apps/mobile/app/build.gradle.kts
      - name: Verify embedded Mobilerun source
        run: |
          test -f third_party/mobilerun-portal/LICENSE
          test -f third_party/mobilerun-portal/app/src/main/java/com/mobilerun/portal/PortalApplication.kt
      - name: Run Android unit tests
        run: gradle -p apps/mobile :app:testDebugUnitTest --stacktrace
      - name: Assemble Cyclone 2.9.5 APK
        run: gradle -p apps/mobile :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp apps/mobile/app/build/outputs/apk/debug/app-debug.apk dist/Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk
          sha256sum dist/Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk > dist/APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cyclone-Mobile-2.9.5-APK
          path: |
            dist/Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk
            dist/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [pc-gateway, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Cyclone-Mobile-2.9.5-APK
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Cyclone-2.9.5-PC-Gateway
          path: dist/pc
      - name: Build full bundle and checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          root = Path('dist')
          apk = root / 'Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk'
          out = root / 'Cyclone-2.9.5-Original-UI-Full-Gateway-Bundle.zip'
          with ZipFile(out, 'w', ZIP_DEFLATED) as z:
              z.write(apk, apk.name)
              for p in sorted((root/'pc').iterdir()):
                  if p.is_file(): z.write(p, f'pc/{p.name}')
          PY
          (cd dist && sha256sum Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk Cyclone-2.9.5-Original-UI-Full-Gateway-Bundle.zip > SHA256SUMS.txt)
      - name: Publish GitHub Release v2.9.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > dist/RELEASE_NOTES.md <<'EOF'
          # Cyclone Mobile 2.9.5 — Original Cyclone UI + Full PC Gateway

          2.9.5 keeps the original 2.9.3 Cyclone Home, Teach, AI, Automations and Brain UI intact while integrating the full USB/PC gateway into the same Android app.

          Fixes:
          - exactly one launcher icon / one `com.cyclone.mobile` app;
          - PC Gateway is no longer a second launcher surface;
          - a small in-app PC Gateway entry opens the gateway controls from Cyclone;
          - all 2.9.4 Android bridge, PC Device Gateway and Codex MCP functionality remains included;
          - original 2.9.3 Cyclone UI source is CI-verified unchanged.

          This remains a debug-signed beta APK. If Android reports a signature mismatch when installing over an APK produced by another CI run, uninstall the older debug build first.
          EOF
          TAG=v2.9.5
          ASSETS=(dist/Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk dist/Cyclone-2.9.5-Original-UI-Full-Gateway-Bundle.zip dist/SHA256SUMS.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "Cyclone Mobile 2.9.5 — Original UI + Full Gateway" --notes-file dist/RELEASE_NOTES.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "Cyclone Mobile 2.9.5 — Original UI + Full Gateway" --notes-file dist/RELEASE_NOTES.md --latest --repo "$GITHUB_REPOSITORY"
          fi
      - name: Commit small verified-build marker
        run: |
          APK=dist/Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk
          BUNDLE=dist/Cyclone-2.9.5-Original-UI-Full-Gateway-Bundle.zip
          APK_HASH=$(sha256sum "$APK" | awk '{print $1}')
          BUNDLE_HASH=$(sha256sum "$BUNDLE" | awk '{print $1}')
          APK_BYTES=$(stat -c%s "$APK")
          mkdir -p releases/2.9.5
          cat > releases/2.9.5/BUILD_VERIFIED.json <<EOF
          {
            "release": "2.9.5",
            "tag": "v2.9.5",
            "verified": true,
            "sourceSha": "$GITHUB_SHA",
            "runId": $GITHUB_RUN_ID,
            "apk": {
              "name": "Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk",
              "bytes": $APK_BYTES,
              "sha256": "$APK_HASH",
              "releaseAsset": "https://github.com/$GITHUB_REPOSITORY/releases/download/v2.9.5/Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk"
            },
            "bundle": {
              "name": "Cyclone-2.9.5-Original-UI-Full-Gateway-Bundle.zip",
              "sha256": "$BUNDLE_HASH"
            },
            "originalUiBase": "c3684dfe2d74836826785eccafed4b6d218cffc1",
            "singleLauncherVerified": true,
            "signing": "debug-signed-beta"
          }
          EOF
          cp dist/SHA256SUMS.txt releases/2.9.5/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- releases/2.9.5
          git commit -m "release: verify Cyclone 2.9.5 binaries [skip ci]"
          git push origin HEAD:release/cyclone-mobile-v2.9.5
