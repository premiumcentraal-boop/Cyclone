name: Cyclone 2.9.5 Unified UI + Full Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - release/cyclone-mobile-v2.9.5

permissions:
  contents: write

concurrency:
  group: cyclone-v2.9.5
  cancel-in-progress: true

jobs:
  pc-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e "./apps/device-gateway[test]"
          python -m pip install -e "./tools/codex-phone-mcp"
      - name: Test PC gateway + MCP + acceptance
        run: |
          python -m pytest apps/device-gateway/tests -q
          python -m unittest discover -s tools/codex-phone-mcp/tests -v
          python -m cyclone_phone_mcp.acceptance --mock
      - name: Build PC wheels
        run: |
          mkdir -p dist/pc
          python -m build --wheel --outdir dist/pc apps/device-gateway
          python -m build --wheel --outdir dist/pc tools/codex-phone-mcp
          cp scripts/phone-gateway/install-windows.ps1 dist/pc/
          cp scripts/phone-gateway/first-run.ps1 dist/pc/
          cp tools/codex-phone-mcp/codex-config.example.toml dist/pc/
          cp docs/CODEX_PHONE_FIRST_RUN.md dist/pc/
      - uses: actions/upload-artifact@v4
        with:
          name: Cyclone-2.9.5-PC-Gateway
          path: dist/pc/*
          if-no-files-found: error
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fast product UI release guard
        run: |
          python - <<'PY'
          from pathlib import Path
          ui = Path('apps/mobile/app/src/main/java/com/cyclone/mobile/ui/CycloneMobileV292App.kt').read_text()
          required = [
              'HOME("Home"', 'TEACH("Teach"', 'AI("AI"',
              'AUTOMATIONS("Automations"', 'BRAIN("Brain"',
              'GatewayAiCard(context, refreshTick)',
              'CycloneRelease.label',
              '.clickable { settingsOpen = true }',
          ]
          missing = [x for x in required if x not in ui]
          assert not missing, f'Missing required Cyclone UI surfaces/integration: {missing}'
          forbidden = ['Cyclone 2.9.3', 'Cyclone 2.9.2 settings', '2.9.3 adds a Page Awareness Sandbox']
          stale = [x for x in forbidden if x in ui]
          assert not stale, f'Stale user-visible release labels remain: {stale}'

          debug = Path('apps/mobile/app/src/main/java/com/cyclone/mobile/debug/PageDebugSandboxV293.kt').read_text()
          debug_forbidden = [
              'Cyclone 2.9.3 Page Debug Sandbox',
              'PAGE DEBUG · 2.9.3',
              'Cyclone 2.9.3 · Page Awareness Sandbox',
          ]
          debug_stale = [x for x in debug_forbidden if x in debug]
          assert not debug_stale, f'Stale visible Page Debug release labels remain: {debug_stale}'
          assert 'CycloneRelease.label' in debug and 'CycloneRelease.version' in debug

          release = Path('apps/mobile/app/src/main/java/com/cyclone/mobile/CycloneRelease.kt').read_text()
          assert 'BuildConfig.VERSION_NAME' in release
          print('Unified Cyclone UI + release identity verified')
          PY

      - name: Verify exactly one launcher activity
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse(Path('apps/mobile/app/src/main/AndroidManifest.xml')).getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          launchers = []
          for activity in root.findall('./application/activity'):
              for filt in activity.findall('intent-filter'):
                  actions = {x.get(ns+'name') for x in filt.findall('action')}
                  cats = {x.get(ns+'name') for x in filt.findall('category')}
                  if 'android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in cats:
                      launchers.append(activity.get(ns+'name'))
          assert launchers == ['.MainActivity'], f'Expected only .MainActivity launcher, got {launchers}'
          print('Single Cyclone launcher verified:', launchers[0])
          PY

      - name: Verify 2.9.5 single-source version + package
        run: |
          grep -q 'applicationId = "com.cyclone.mobile"' apps/mobile/app/build.gradle.kts
          grep -q 'versionCode = 17' apps/mobile/app/build.gradle.kts
          grep -q 'versionName = "2.9.5"' apps/mobile/app/build.gradle.kts
          ! grep -n 'Cyclone 2.9.3' apps/mobile/app/src/main/java/com/cyclone/mobile/ui/CycloneMobileV292App.kt || exit 1
          ! grep -n 'Cyclone 2.9.2 settings' apps/mobile/app/src/main/java/com/cyclone/mobile/ui/CycloneMobileV292App.kt || exit 1

      - name: Verify embedded Mobilerun source
        run: |
          test -f third_party/mobilerun-portal/LICENSE
          test -f third_party/mobilerun-portal/app/src/main/java/com/mobilerun/portal/PortalApplication.kt

      - name: Test and assemble Android in one Gradle invocation
        run: gradle -p apps/mobile :app:testDebugUnitTest :app:assembleDebug --stacktrace --parallel

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp apps/mobile/app/build/outputs/apk/debug/app-debug.apk dist/Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk
          sha256sum dist/Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk > dist/APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cyclone-Mobile-2.9.5-APK
          path: |
            dist/Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk
            dist/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [pc-gateway, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Cyclone-Mobile-2.9.5-APK
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Cyclone-2.9.5-PC-Gateway
          path: dist/pc
      - name: Build full bundle and checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          root = Path('dist')
          apk = root / 'Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk'
          out = root / 'Cyclone-2.9.5-Original-UI-Full-Gateway-Bundle.zip'
          with ZipFile(out, 'w', ZIP_DEFLATED) as z:
              z.write(apk, apk.name)
              for p in sorted((root/'pc').iterdir()):
                  if p.is_file(): z.write(p, f'pc/{p.name}')
          PY
          (cd dist && sha256sum Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk Cyclone-2.9.5-Original-UI-Full-Gateway-Bundle.zip > SHA256SUMS.txt)

      - name: Publish refreshed GitHub Release v2.9.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > dist/RELEASE_NOTES.md <<'EOF'
          # Cyclone Mobile 2.9.5 — Unified Cyclone + Full AI Gateway

          This refreshed 2.9.5 keeps Cyclone's Home, Teach, AI, Automations and Brain experience while integrating the full PC/Codex Gateway as an obvious special feature inside the AI page.

          UI fixes:
          - the Cyclone profile badge opens Cyclone Settings;
          - the redundant top-right settings button/floating gateway button are removed;
          - Full PC + Codex Gateway has a prominent AI-page control card with readiness, enable/disable, token copy and control-center access;
          - Android release text, Settings and Page Awareness use one BuildConfig-backed release identity, eliminating stale 2.9.2/2.9.3 labels;
          - exactly one Cyclone launcher remains.

          The Android bridge, Device Gateway, App Graph/Brain retrieval, teaching, typed actions, screenshots, diagnostics and Codex MCP remain included.

          This is still a debug-signed beta APK.
          EOF
          TAG=v2.9.5
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"
          ASSETS=(dist/Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk dist/Cyclone-2.9.5-Original-UI-Full-Gateway-Bundle.zip dist/SHA256SUMS.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "Cyclone Mobile 2.9.5 — Unified UI + Full AI Gateway" --notes-file dist/RELEASE_NOTES.md --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "Cyclone Mobile 2.9.5 — Unified UI + Full AI Gateway" --notes-file dist/RELEASE_NOTES.md --latest --repo "$GITHUB_REPOSITORY"
          fi

      - name: Commit verified-build marker
        run: |
          APK=dist/Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk
          BUNDLE=dist/Cyclone-2.9.5-Original-UI-Full-Gateway-Bundle.zip
          APK_HASH=$(sha256sum "$APK" | awk '{print $1}')
          BUNDLE_HASH=$(sha256sum "$BUNDLE" | awk '{print $1}')
          APK_BYTES=$(stat -c%s "$APK")
          mkdir -p releases/2.9.5
          cat > releases/2.9.5/BUILD_VERIFIED.json <<EOF
          {
            "release": "2.9.5",
            "tag": "v2.9.5",
            "verified": true,
            "sourceSha": "$GITHUB_SHA",
            "runId": $GITHUB_RUN_ID,
            "apk": {
              "name": "Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk",
              "bytes": $APK_BYTES,
              "sha256": "$APK_HASH",
              "releaseAsset": "https://github.com/$GITHUB_REPOSITORY/releases/download/v2.9.5/Cyclone-Mobile-2.9.5-Original-UI-Full-Gateway.apk"
            },
            "bundle": {
              "name": "Cyclone-2.9.5-Original-UI-Full-Gateway-Bundle.zip",
              "sha256": "$BUNDLE_HASH"
            },
            "uiGuard": "home-teach-ai-automations-brain+gateway+profile-settings+page-awareness",
            "singleLauncherVerified": true,
            "versionSource": "BuildConfig.VERSION_NAME",
            "signing": "debug-signed-beta"
          }
          EOF
          cp dist/SHA256SUMS.txt releases/2.9.5/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- releases/2.9.5
          git commit -m "release: verify refreshed Cyclone 2.9.5 binaries [skip ci]"
          git push origin HEAD:release/cyclone-mobile-v2.9.5
