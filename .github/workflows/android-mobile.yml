name: Cyclone Mobile V2.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/android-mobile-v0
      - feature/mobile-phone-toolbox-agent1
      - release/cyclone-mobile-v2
      - release/cyclone-mobile-v2.2
      - feature/mobile-v2-modern-ui-mobilerun-embedded
    paths:
      - 'apps/mobile/**'
      - 'third_party/mobilerun-portal'
      - '.gitmodules'
      - '.github/workflows/android-mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'third_party/mobilerun-portal'
      - '.gitmodules'
      - '.github/workflows/android-mobile.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run V2.2 mobile unit tests
        run: gradle -p apps/mobile :app:testDebugUnitTest --stacktrace
      - name: Assemble V2.2 debug APK
        run: gradle -p apps/mobile :app:assembleDebug --stacktrace
      - name: Upload V2.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: cyclone-mobile-v2-2-apk
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
