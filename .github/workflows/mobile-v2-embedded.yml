name: Cyclone Mobile V2.8 Embedded Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/cyclone-mobile-v2.2
      - release/cyclone-mobile-v2.3-openrouter-agent
      - release/cyclone-mobile-v2.4-guided-recorder
      - release/cyclone-mobile-v2.5-app-learner-beta
      - release/cyclone-mobile-v2.6-ai-brain-rehaul
      - release/cyclone-mobile-v2.7-adaptive-brain
      - release/cyclone-mobile-v2.8-page-aware-agent
      - feature/mobile-v2-modern-ui-mobilerun-embedded
    paths:
      - 'apps/mobile/**'
      - 'third_party/mobilerun-portal'
      - '.gitmodules'
      - '.github/workflows/mobile-v2-embedded.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'third_party/mobilerun-portal'
      - '.gitmodules'
      - '.github/workflows/mobile-v2-embedded.yml'

jobs:
  android-v2-embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Mobilerun source is present
        run: test -f third_party/mobilerun-portal/LICENSE && test -f third_party/mobilerun-portal/app/src/main/java/com/mobilerun/portal/PortalApplication.kt
      - name: Run Cyclone V2.8 Android tests
        run: gradle -p apps/mobile :app:testDebugUnitTest --stacktrace
      - name: Assemble unified Cyclone V2.8 APK
        run: gradle -p apps/mobile :app:assembleDebug --stacktrace
      - name: Upload unified APK
        uses: actions/upload-artifact@v4
        with:
          name: cyclone-mobile-v2-8-embedded-apk
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
