name: Apply V3.2 Beta 3 permission UI cleanup

on:
  push:
    branches: [feature/v320-beta3-single-permissions-insets]
    paths:
      - '.github/workflows/apply-v320-beta3-permission-ui-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply beta3 single-permission settings cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/v320-beta3-single-permissions-insets
      - name: Remove legacy second-accessibility setup row
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/mobile/app/src/main/java/com/cyclone/mobile/ui/v32/CycloneV32FeaturePages.kt')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          skip = 0
          removed_state = False
          removed_row = False
          for line in lines:
              if skip:
                  skip -= 1
                  continue
              if 'val enhancedControl = CyclonePermissionSetup.enhancedControlEnabled(context)' in line:
                  removed_state = True
                  continue
              if 'CyclonePermissionRow(Icons.Rounded.Layers, "Enhanced control engine"' in line:
                  removed_row = True
                  skip = 2
                  continue
              output.append(line)
          if not removed_state or not removed_row:
              raise SystemExit('Expected enhanced-control UI block was not found exactly once')
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
      - name: Commit focused UI cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/app/src/main/java/com/cyclone/mobile/ui/v32/CycloneV32FeaturePages.kt
          git commit -m 'refactor(mobile): remove duplicate enhanced-control setup row'
          git push origin HEAD:feature/v320-beta3-single-permissions-insets
