name: Device Trust CI

on:
  pull_request:
    paths:
      - 'device-trust/service/**'
      - 'device-trust/android/**'
      - '.github/workflows/device-trust-ci.yml'
  push:
    branches: [main]
    paths:
      - 'device-trust/service/**'
      - 'device-trust/android/**'
      - '.github/workflows/device-trust-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-trust-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: Trust service (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test
        run: |
          python -m pip install --disable-pip-version-check -e 'device-trust/service[test]'
          python -m pytest -q device-trust/service/tests

  android:
    name: Android client library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device-trust/android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test, lint and assemble
        run: ./gradlew --no-daemon :devicetrust:testDebugUnitTest :devicetrust:lintRelease :devicetrust:assembleRelease
