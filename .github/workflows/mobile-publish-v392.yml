name: Cyclone Mobile Dev APK 3.9.2

on:
  push:
    branches: ['release/cyclone-mobile-v3.9.2']
    paths:
      - '.github/workflows/mobile-publish-v392.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-dev-v3.9.2
  cancel-in-progress: true

jobs:
  build-dev-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Check version and build installable APK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release_versions.py --check
          ./apps/mobile/gradlew -p apps/mobile :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Package dev APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/mobile
          apk='apps/mobile/app/build/outputs/apk/debug/app-debug.apk'
          out='dist/mobile/Cyclone-3.9.2-dev.apk'
          test -s "$apk"
          cp "$apk" "$out"

          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$aapt" dump badging "$out" | tee dist/mobile/apk-badging.txt
          "$apksigner" verify --min-sdk-version 34 --verbose --print-certs "$out" > dist/mobile/signing-info.txt

          grep -q "package: name='com.cyclone.mobile'" dist/mobile/apk-badging.txt
          grep -q "versionCode='56'" dist/mobile/apk-badging.txt
          grep -q "versionName='3.9.2'" dist/mobile/apk-badging.txt

          (cd dist/mobile && sha256sum Cyclone-3.9.2-dev.apk > Cyclone-3.9.2-dev.apk.sha256)
          printf '%s\n' "$GITHUB_SHA" > dist/mobile/source-sha.txt
          printf '%s\n' 'DEBUG_SIGNED_PERSONAL_DEVELOPMENT' > dist/mobile/signing-state.txt

      - name: Upload installable 3.9.2 dev APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cyclone-3.9.2-dev
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 30
