name: Cyclone Mobile Publish 3.9.2

on:
  push:
    branches: ['release/cyclone-mobile-v3.9.2']
    paths:
      - '.github/workflows/mobile-publish-v392.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mobile-publish-v3.9.2
  cancel-in-progress: false

jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test and build release candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release_versions.py --check
          ./apps/mobile/gradlew -p apps/mobile :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
          candidate='apps/mobile/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$candidate"
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$candidate" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.cyclone.mobile'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='56'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='3.9.2'" "$RUNNER_TEMP/badging.txt"
          if grep -Eq 'testOnly[= ]true' "$RUNNER_TEMP/badging.txt"; then
            echo 'ERROR: release candidate is testOnly.' >&2
            exit 1
          fi

      - name: Recover legacy update-compatible signer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Personal-development release path only. The historical signer is already public/exposed,
          # but using it keeps sideloaded Cyclone 3.9.1 installs update-compatible without requiring
          # private release secrets or uninstalling the app and losing local state.
          legacy_ref='release/cyclone-mobile-v3.9.0'
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/release.keystore.b64?ref=$legacy_ref" --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/release.keystore.b64"
          base64 --decode "$RUNNER_TEMP/release.keystore.b64" > "$RUNNER_TEMP/release.keystore"
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/app/build.gradle.kts?ref=$legacy_ref" --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/legacy.gradle.kts"
          python3 - "$RUNNER_TEMP/legacy.gradle.kts" "$RUNNER_TEMP/legacy-signing.env" <<'PY'
          import re, shlex, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          match = re.search(r'create\("ciRelease"\)\s*\{(?P<body>.*?)\n\s*\}', text, re.S)
          if not match:
              raise SystemExit('legacy ciRelease signing block not found')
          body = match.group('body')
          def value(name):
              m = re.search(rf'{name}\s*=\s*"([^"]+)"', body)
              if not m:
                  raise SystemExit(f'legacy {name} not found')
              return m.group(1)
          with open(sys.argv[2], 'w', encoding='utf-8') as out:
              out.write('STORE_PASSWORD=' + shlex.quote(value('storePassword')) + '\n')
              out.write('KEY_ALIAS=' + shlex.quote(value('keyAlias')) + '\n')
              out.write('KEY_PASSWORD=' + shlex.quote(value('keyPassword')) + '\n')
          PY
          chmod 600 "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/legacy-signing.env"

      - name: Sign update-compatible APK
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/legacy-signing.env"
          export STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          mkdir -p dist/mobile
          candidate='apps/mobile/app/build/outputs/apk/release/app-release-unsigned.apk'
          out='dist/mobile/Cyclone-3.9.2.apk'
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$out" \
            "$candidate"
          "$apksigner" verify --min-sdk-version 34 --verbose --print-certs "$out" | tee dist/mobile/signing-info.txt
          (cd dist/mobile && sha256sum Cyclone-3.9.2.apk > Cyclone-3.9.2.apk.sha256)
          printf '%s\n' "$GITHUB_SHA" > dist/mobile/source-sha.txt
          printf '%s\n' 'SIGNED_LEGACY_UPDATE_COMPATIBILITY_KEY_PERSONAL_DEV' > dist/mobile/signing-state.txt

      - name: Verify in-place update compatibility with 3.9.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior
          gh release download v3.9.1 --repo "$GITHUB_REPOSITORY" --pattern 'Cyclone-3.9.1.apk' --dir prior
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$apksigner" verify --min-sdk-version 34 --verbose --print-certs dist/mobile/Cyclone-3.9.2.apk > "$RUNNER_TEMP/new-cert.txt"
          "$apksigner" verify --min-sdk-version 34 --verbose --print-certs prior/Cyclone-3.9.1.apk > "$RUNNER_TEMP/prior-cert.txt"
          new_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-cert.txt" | head -n 1 | tr 'A-F' 'a-f')"
          prior_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/prior-cert.txt" | head -n 1 | tr 'A-F' 'a-f')"
          test -n "$new_cert"
          test -n "$prior_cert"
          test "$new_cert" = "$prior_cert"
          echo 'Verified: Cyclone 3.9.2 can update the published 3.9.1 install in place.'

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cyclone-3.9.2-update-compatible
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v3.9.2'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/mobile/Cyclone-3.9.2.apk \
              dist/mobile/Cyclone-3.9.2.apk.sha256 \
              dist/mobile/source-sha.txt \
              dist/mobile/signing-state.txt
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # Cyclone 3.9.2

          Personal-development prerelease focused on agent reliability and observability.

          - Fixes Brain diagnostic export for active and suspended runs.
          - Adds Adaptive Free Mode and bounded anti-loop recovery.
          - Hardens semantic verification so page/hash churn does not count as progress.
          - Improves Chrome/browser launching and URL fallback behavior.
          - Uses the same already-exposed development/update signer as 3.9.1 so existing sideloaded installs can update in place without uninstalling or configuring release secrets.

          This signing path is intended for personal development, not production distribution.
          Physical-device acceptance remains unverified in CI.
          EOF
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Cyclone 3.9.2' \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/mobile/Cyclone-3.9.2.apk \
            dist/mobile/Cyclone-3.9.2.apk.sha256 \
            dist/mobile/source-sha.txt \
            dist/mobile/signing-state.txt

      - name: Destroy recovered signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/release.keystore.b64" "$RUNNER_TEMP/legacy.gradle.kts" "$RUNNER_TEMP/legacy-signing.env"
