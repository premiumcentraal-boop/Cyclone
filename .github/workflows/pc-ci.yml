name: Cyclone PC CI
# Every change to the PC stack: the full gateway, MCP and Ports tests on Windows, then the real Cyclone for Windows
# package (plan 31: runtime + Glass + the `cyclone` command) built, installed and smoke-tested with the same script the
# release uses (scripts/pc/build-pc-package.ps1). The retired Cyclone One desktop window is not built.
on:
  pull_request:
    paths:
      - 'apps/glass/**'
      - 'apps/device-gateway/**'
      - 'tools/cyclone-agent-mcp/**'
      - 'tools/codex-phone-mcp/**'
      - 'tools/cyclone-ports-sdk/**'
      - 'packaging/pc/**'
      - 'packaging/pc/**'
      - 'scripts/pc/**'
      - 'scripts/pc/**'
      - 'scripts/vmos/**'
      - 'packaging/pc/resources/**'
      - 'release/version.toml'
      - '.github/workflows/pc-ci.yml'
  push:
    branches: [main, 'claude/cyclone-v5-handoff-review-9qrs40']
    paths:
      - 'apps/glass/**'
      - 'apps/device-gateway/**'
      - 'tools/cyclone-agent-mcp/**'
      - 'tools/codex-phone-mcp/**'
      - 'tools/cyclone-ports-sdk/**'
      - 'packaging/pc/**'
      - 'packaging/pc/**'
      - 'scripts/pc/**'
      - 'scripts/pc/**'
      - 'scripts/vmos/**'
      - 'packaging/pc/resources/**'
      - 'release/version.toml'
      - '.github/workflows/pc-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # The check keeps its earlier name so any rule that requires it still matches.
    name: Windows companion
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.7'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check release metadata
        shell: pwsh
        run: python scripts/ci/release_versions.py --check
      - name: Test gateway, MCP and Ports on Windows
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e 'apps/device-gateway[test]' -e 'tools/cyclone-agent-mcp[test]' -e tools/codex-phone-mcp -e tools/cyclone-ports-sdk
          python -m pytest -q apps/device-gateway/tests
          python -m pytest -q tools/cyclone-agent-mcp/tests
          python -m unittest discover -s tools/codex-phone-mcp/tests -v
          python -m pytest -q -p no:cacheprovider tools/cyclone-ports-sdk/tests
      - name: Parse the PowerShell setup scripts
        shell: pwsh
        run: |
          $failed = $false
          @(Get-ChildItem 'scripts/vmos/*.ps1') + @(Get-ChildItem 'scripts/pc/*.ps1') + @(Get-ChildItem 'packaging/pc/resources/chatgpt-attach/scripts/*.ps1') | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { throw 'PowerShell scripts contain syntax errors.' }
      - name: Build, install and smoke-test Cyclone-PC
        shell: pwsh
        run: |
          $product = (python -c "import tomllib; print(tomllib.load(open('release/version.toml','rb'))['product_version'])").Trim()
          ./scripts/pc/build-pc-package.ps1 -Version $product -OutDir dist/pc-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyclone-pc-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/pc-package/
          if-no-files-found: error
          retention-days: 14
