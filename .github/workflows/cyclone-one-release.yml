name: Cyclone One v0.2 Full Release

on:
  push:
    branches: ['release/cyclone-one-v0.2']
    paths:
      - 'apps/mobile/**'
      - 'apps/device-gateway/**'
      - 'tools/cyclone-agent-mcp/**'
      - 'tools/codex-phone-mcp/**'
      - 'apps/pc-companion/**'
      - 'packaging/pc-companion/**'
      - 'scripts/pc-companion/**'
      - 'scripts/ci/**'
      - '.github/workflows/_mobile-build.yml'
      - '.github/workflows/cyclone-one-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cyclone-one-v0.2-full-release
  cancel-in-progress: true

jobs:
  android-gate:
    name: Android execution gateway
    uses: ./.github/workflows/_mobile-build.yml
    with:
      allow_independent_pc_version: true
    permissions:
      contents: read

  windows-build:
    name: Windows Cyclone One
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'

      - name: Validate gateway and MCP contracts
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e 'apps/device-gateway[test]' -e 'tools/cyclone-agent-mcp[test]' -e tools/codex-phone-mcp
          python scripts/ci/release_versions.py --check
          python -m pytest -q apps/device-gateway/tests
          python -m pytest -q tools/cyclone-agent-mcp/tests
          python -m unittest discover -s tools/codex-phone-mcp/tests -v
          python scripts/pc-companion/smoke-android-execution-gateway.py
          python scripts/ci/repository_security_guard.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/pc-companion/package-lock.json

      - name: Verify Cyclone One product identity
        shell: pwsh
        run: |
          $Package = Get-Content 'apps/pc-companion/package.json' | ConvertFrom-Json
          $Tauri = Get-Content 'apps/pc-companion/src-tauri/tauri.conf.json' | ConvertFrom-Json
          if ($Package.version -ne '0.2.0') { throw "Unexpected package version: $($Package.version)" }
          if ($Tauri.productName -ne 'Cyclone One') { throw "Unexpected product name: $($Tauri.productName)" }
          if ($Tauri.version -ne '0.2.0') { throw "Unexpected Tauri version: $($Tauri.version)" }
          if ($Tauri.identifier -ne 'com.cyclone.one') { throw "Unexpected Tauri identifier: $($Tauri.identifier)" }
          if ($Tauri.app.windows[0].title -ne 'Cyclone One') { throw 'Cyclone One window title is not configured.' }

      - name: Test and compile Cyclone One frontend
        shell: pwsh
        run: |
          Push-Location apps/pc-companion
          npm ci --no-audit --no-fund
          npm test
          npm run build
          Pop-Location

      - name: Check Rust shell
        shell: pwsh
        run: cargo check --manifest-path apps/pc-companion/src-tauri/Cargo.toml

      - name: Build frozen Cyclone sidecars
        shell: pwsh
        run: ./scripts/pc-companion/build-sidecars.ps1

      - name: Build Cyclone One NSIS installer
        shell: pwsh
        run: |
          Push-Location apps/pc-companion
          npm run tauri build -- --bundles nsis
          Pop-Location

      - name: Stage Cyclone One installer
        shell: pwsh
        run: |
          $Installer = Get-ChildItem 'apps/pc-companion/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if ($null -eq $Installer) { throw 'Cyclone One NSIS installer was not produced.' }
          New-Item -ItemType Directory -Force -Path dist/cyclone-one | Out-Null
          Copy-Item $Installer.FullName 'dist/cyclone-one/Cyclone-One-0.2.0-Setup.exe' -Force

      - name: Sign Windows installer when credentials are configured
        shell: pwsh
        env:
          CYCLONE_WINDOWS_SIGN_PFX_BASE64: ${{ secrets.CYCLONE_WINDOWS_SIGN_PFX_BASE64 }}
          CYCLONE_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.CYCLONE_WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          ./scripts/pc-companion/sign-artifacts.ps1 -ArtifactDirectory dist/cyclone-one
          if (-not [string]::IsNullOrWhiteSpace($env:CYCLONE_WINDOWS_SIGN_PFX_BASE64) -and -not [string]::IsNullOrWhiteSpace($env:CYCLONE_WINDOWS_SIGN_PFX_PASSWORD)) {
            'WINDOWS_CODE_SIGNED' | Set-Content -NoNewline 'dist/cyclone-one/windows-signing-state.txt'
          } else {
            'UNSIGNED_WINDOWS_INSTALLER' | Set-Content -NoNewline 'dist/cyclone-one/windows-signing-state.txt'
          }

      - name: Generate provenance and notices
        shell: pwsh
        run: |
          python scripts/pc-companion/generate-third-party-notices.py --lock packaging/pc-companion/third-party-binaries.lock.json --output dist/cyclone-one/THIRD_PARTY_NOTICES
          python scripts/pc-companion/generate-release-metadata.py --artifact-dir dist/cyclone-one --source-sha '${{ github.sha }}' --version 0.2.0 --product 'Cyclone One' --third-party-lock packaging/pc-companion/third-party-binaries.lock.json

      - name: Upload exact Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: Cyclone-One-0.2.0
          path: dist/cyclone-one/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Cyclone One v0.2
    needs: [android-gate, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            docs/RELEASE_CYCLONE_ONE_0.2.md

      - name: Refuse replacement of an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view cyclone-one-v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'ERROR: cyclone-one-v0.2.0 already exists; release artifacts are immutable.' >&2
            exit 1
          fi

      - name: Download exact Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: Cyclone-One-0.2.0
          path: release

      - name: Verify Cyclone One provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s release/Cyclone-One-0.2.0-Setup.exe
          test -s release/SHA256SUMS.txt
          test -s release/source-sha.txt
          test -s release/release-provenance.json
          test -s release/windows-signing-state.txt
          test "$(tr -d '\r\n' < release/source-sha.txt)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('release')
          p = json.loads((root / 'release-provenance.json').read_text())
          assert p['product'] == 'Cyclone One'
          assert p['version'] == '0.2.0'
          assert p['source_sha'] == os.environ['GITHUB_SHA'].lower()
          assert [x['name'] for x in p['artifacts']] == ['Cyclone-One-0.2.0-Setup.exe']
          PY
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Publish full Cyclone One release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signing_state="$(tr -d '\r\n' < release/windows-signing-state.txt)"
          cat docs/RELEASE_CYCLONE_ONE_0.2.md > "$RUNNER_TEMP/cyclone-one-notes.md"
          if [[ "$signing_state" == "WINDOWS_CODE_SIGNED" ]]; then
            printf '\n## Windows signing\nThe installer was Windows code-signed by the configured release certificate.\n' >> "$RUNNER_TEMP/cyclone-one-notes.md"
          else
            printf '\n## Windows signing\nThe v0.2 installer is not Windows code-signed because no Windows signing certificate was configured for this repository. Windows may show an unknown-publisher warning.\n' >> "$RUNNER_TEMP/cyclone-one-notes.md"
          fi
          printf '\nSource SHA: `%s`\n' "$(cat release/source-sha.txt)" >> "$RUNNER_TEMP/cyclone-one-notes.md"
          gh release create cyclone-one-v0.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Cyclone One v0.2' \
            --notes-file "$RUNNER_TEMP/cyclone-one-notes.md" \
            release/Cyclone-One-0.2.0-Setup.exe \
            release/SHA256SUMS.txt \
            release/source-sha.txt \
            release/release-provenance.json \
            release/windows-signing-state.txt \
            release/THIRD_PARTY_NOTICES
