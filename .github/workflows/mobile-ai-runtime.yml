name: Cyclone Mobile AI Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mobile-ai-runtime
  pull_request:
    paths:
      - 'apps/cyclone-core/**'
      - 'apps/mobile/**'
      - 'docker/**'
      - '.github/workflows/mobile-ai-runtime.yml'

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cyclone-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/cyclone-core/requirements.txt
      - name: Install Core dependencies
        run: pip install -r requirements.txt
      - name: Run Agent 3 mobile runtime tests
        run: pytest -q tests/test_mobile_*.py

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle -p apps/mobile :app:assembleDebug --stacktrace
