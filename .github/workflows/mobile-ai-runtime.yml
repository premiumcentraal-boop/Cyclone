name: Cyclone Mobile Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/cyclone-mobile-v*'
      - feature/mobile-v2-modern-ui-mobilerun-embedded
    paths:
      - 'apps/cyclone-core/**'
      - 'docker/**'
      - '.env.example'
      - '.github/workflows/mobile-ai-runtime.yml'
  pull_request:
    paths:
      - 'apps/cyclone-core/**'
      - 'docker/**'
      - '.env.example'
      - '.github/workflows/mobile-ai-runtime.yml'

jobs:
  core-mobile-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cyclone-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/cyclone-core/requirements.txt
      - name: Install Core dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run Hermes mobile + Mobilerun tests
        run: python -m pytest -q tests/test_mobile_*.py
      - name: Import Core entrypoint
        run: python -c "from app.mobile_entry import app; assert any(getattr(r, 'path', '') == '/api/v1/mobile/connect' for r in app.routes)"
