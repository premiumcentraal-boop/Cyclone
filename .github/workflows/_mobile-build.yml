name: Reusable Cyclone Mobile Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source without credentials or submodules
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Run cheap metadata and architecture guards
        id: mobile
        shell: bash
        run: |
          python3 scripts/ci/mobile_metadata.py --github-output "$GITHUB_OUTPUT" --json mobile-metadata.json
          python3 -m unittest discover -s scripts/ci/tests -v
          PYTHONPATH=tools/cyclone-agent-coordinator python3 -m unittest discover -s tools/cyclone-agent-coordinator/tests -v
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK packages
        shell: bash
        # The app targets 35; the embedded Mobilerun module still selects 34.0.0.
        # Pin both here so Gradle never performs a surprise SDK download mid-build.
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Initialize embedded runtime source
        shell: bash
        run: git submodule update --init --recursive --depth 1
      - name: Test and assemble once
        shell: bash
        run: ./apps/mobile/gradlew -p apps/mobile :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Package APK provenance
        shell: bash
        env:
          APK_NAME: ${{ steps.mobile.outputs.apk_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/mobile
          cp apps/mobile/app/build/outputs/apk/debug/app-debug.apk "dist/mobile/$APK_NAME"
          (cd dist/mobile && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          printf '%s\n' "$GITHUB_SHA" > dist/mobile/source-sha.txt
          cp mobile-metadata.json dist/mobile/mobile-metadata.json
      - name: Upload APK, checksum, version metadata, and source SHA once
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mobile.outputs.artifact_name }}
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 30
      - name: Build summary
        shell: bash
        run: |
          echo "## Cyclone Mobile build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.mobile.outputs.version_name }} (${{ steps.mobile.outputs.version_code }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`${{ steps.mobile.outputs.artifact_name }}\`" >> "$GITHUB_STEP_SUMMARY"
