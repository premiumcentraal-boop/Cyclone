name: Apply Cyclone 3.9.2 Runtime Patch

on:
  push:
    branches: ['release/cyclone-mobile-v3.9.2']
    paths:
      - 'scripts/ci/apply_mobile_392_patch.py'
      - '.github/workflows/apply-mobile-392-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/cyclone-mobile-v3.9.2
          fetch-depth: 0
      - name: Apply exact runtime patch
        run: python3 scripts/ci/apply_mobile_392_patch.py
      - name: Commit runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/app/src/main/java/com/cyclone/mobile/agent/CycloneLocalAgent.kt \
                  apps/mobile/app/src/main/java/com/cyclone/mobile/ai/OpenRouterAdaptiveAgent.kt \
                  apps/mobile/app/src/main/java/com/cyclone/mobile/agent/tools/CycloneAgentEnvironment.kt
          git diff --cached --check
          git commit -m 'feat(mobile): add adaptive free mode and progress-bounded recovery'
          git push origin HEAD:release/cyclone-mobile-v3.9.2
