name: Publish Cyclone 3.8.8 Once

on:
  push:
    branches:
      - release/cyclone-mobile-v3.8.8
    paths:
      - .github/workflows/publish-v388-mobile-once.yml
      - release/version.toml
      - apps/mobile/app/build.gradle.kts
      - docs/release-notes/v3.8.8.md

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-cyclone-mobile-v3.8.8-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v3.8.8
      RELEASE_TITLE: Cyclone 3.8.8
      ARTIFACT_NAME: Cyclone-Android-3.8.8
      APK_NAME: Cyclone-3.8.8.apk
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate explicit release authorization and identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("release/version.toml").read_text(encoding="utf-8"))
          assert metadata["product_version"] == "3.8.8"
          assert metadata["android_version_code"] == 53
          assert metadata["components"]["mobile"] == "3.8.8"
          assert metadata["release"]["publication_authorized"] is True
          assert metadata["release"]["physical_pixel8"] == "UNVERIFIED"
          gradle = Path("apps/mobile/app/build.gradle.kts").read_text(encoding="utf-8")
          assert re.search(r'^\s*versionCode\s*=\s*53\s*$', gradle, re.M)
          assert re.search(r'^\s*versionName\s*=\s*"3\.8\.8"\s*$', gradle, re.M)
          PY

      - name: Wait for authoritative CI for this exact source SHA
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 120); do
            runs="$(gh run list               --repo "$GITHUB_REPOSITORY"               --workflow mobile-ci.yml               --commit "$GITHUB_SHA"               --event push               --limit 10               --json databaseId,status,conclusion,headSha,headBranch)"
            run_id="$(jq -r --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME"               '[.[] | select(.headSha == $sha and .headBranch == $branch)] | first | .databaseId // empty' <<<"$runs")"
            if [[ -n "$run_id" ]]; then
              status="$(jq -r --argjson id "$run_id"                 '[.[] | select(.databaseId == $id)] | first | .status // empty' <<<"$runs")"
              conclusion="$(jq -r --argjson id "$run_id"                 '[.[] | select(.databaseId == $id)] | first | .conclusion // empty' <<<"$runs")"
              if [[ "$status" == "completed" ]]; then
                test "$conclusion" = "success"
                printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for successful Cyclone Mobile CI for $GITHUB_SHA" >&2
          exit 1

      - name: Download exact CI artifact
        shell: bash
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh run download "$CI_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "$ARTIFACT_NAME"             --dir candidate

      - name: Verify APK identity checksum and provenance
        shell: bash
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -euo pipefail
          test -s "candidate/$APK_NAME"
          test -s "candidate/$APK_NAME.sha256"
          test -s candidate/mobile-metadata.json
          test -s candidate/source-sha.txt
          test -s candidate/run-id.txt
          test "$(tr -d '\r\n' < candidate/source-sha.txt)" = "$GITHUB_SHA"
          test "$(tr -d '\r\n' < candidate/run-id.txt)" = "$CI_RUN_ID"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("candidate/mobile-metadata.json").read_text(encoding="utf-8"))
          assert m["version_name"] == "3.8.8"
          assert m["version_code"] == 53
          assert m["application_id"] == "com.cyclone.mobile"
          assert m["apk_name"] == "Cyclone-3.8.8.apk"
          assert m["artifact_name"] == "Cyclone-Android-3.8.8"
          PY
          (cd candidate && sha256sum --check "$APK_NAME.sha256")

      - name: Publish verified GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.target_commitish')"
            test "$existing_target" = "$GITHUB_SHA"
            echo "$RELEASE_TAG already exists at the exact release SHA."
            exit 0
          fi
          gh release create "$RELEASE_TAG"             "candidate/$APK_NAME"             "candidate/$APK_NAME.sha256"             candidate/mobile-metadata.json             candidate/source-sha.txt             candidate/run-id.txt             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "$RELEASE_TITLE"             --notes-file docs/release-notes/v3.8.8.md             --prerelease
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
