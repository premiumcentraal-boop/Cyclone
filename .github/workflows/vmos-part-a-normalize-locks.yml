name: VMOS Part A Normalize Locks

on:
  push:
    branches: ['codex/vmos-compatibility']
    paths:
      - 'apps/pc-companion/package.json'
      - 'apps/pc-companion/package-lock.json'
      - 'apps/pc-companion/src-tauri/Cargo.toml'
      - 'apps/pc-companion/src-tauri/Cargo.lock'
      - '.github/workflows/vmos-part-a-normalize-locks.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message != 'chore(vmos): normalize One 1.5.1 lockfiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/pc-companion/package-lock.json
      - name: Normalize npm lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix apps/pc-companion
      - name: Normalize Cargo lock
        run: cargo check --manifest-path apps/pc-companion/src-tauri/Cargo.toml
      - name: Verify One 1.5.1 lock identities
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          pkg=json.loads(Path('apps/pc-companion/package-lock.json').read_text())
          assert pkg['version']=='1.5.1'
          assert pkg['packages']['']['version']=='1.5.1'
          cargo=Path('apps/pc-companion/src-tauri/Cargo.lock').read_text()
          assert re.search(r'name = "cyclone-pc-companion"\nversion = "1\.5\.1"', cargo)
          PY
      - name: Commit generated lockfiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pc-companion/package-lock.json apps/pc-companion/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Lockfiles already normalized.'
            exit 0
          fi
          git commit -m 'chore(vmos): normalize One 1.5.1 lockfiles'
          git push origin HEAD:codex/vmos-compatibility
