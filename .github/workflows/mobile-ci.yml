name: Cyclone Mobile CI

on:
  push:
    branches: [main, 'claude/cyclone-v5-handoff-review-9qrs40', 'release/cyclone-mobile-v*']
    paths:
      - 'apps/mobile/**'
      - 'apps/device-gateway/**'
      - 'tools/codex-phone-mcp/**'
      - 'tools/cyclone-agent-mcp/**'
      - 'scripts/ci/**'
      - 'scripts/phone-gateway/**'
      - 'release/version.toml'
      - '.github/workflows/_mobile-build.yml'
      - '.github/workflows/_sign-owner-test.yml'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/device-gateway/**'
      - 'tools/codex-phone-mcp/**'
      - 'tools/cyclone-agent-mcp/**'
      - 'scripts/ci/**'
      - 'scripts/phone-gateway/**'
      - 'release/version.toml'
      - '.github/workflows/_mobile-build.yml'
      - '.github/workflows/_sign-owner-test.yml'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:
    inputs:
      sign_owner_test:
        description: 'Sign the tested phone candidate as an access-controlled artifact; never publish a release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    uses: ./.github/workflows/_mobile-build.yml
    permissions:
      contents: read

  signed-owner-test:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_owner_test
    needs: mobile
    uses: ./.github/workflows/_sign-owner-test.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
