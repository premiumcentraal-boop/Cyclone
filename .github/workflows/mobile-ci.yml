name: Cyclone Mobile CI

on:
  push:
    branches: [main, 'release/cyclone-mobile-v*', 'feature/cyclone-3.5.2-beta', 'agent/352-release-integration']
    paths:
      - 'apps/mobile/**'
      - 'apps/teamwork-sniper/**'
      - '!apps/mobile/AGENTS.md'
      - '!apps/mobile/**/*.md'
      - 'third_party/mobilerun-portal'
      - 'third_party/mobilerun-portal/**'
      - '.gitmodules'
      - 'scripts/ci/mobile_metadata.py'
      - 'scripts/ci/mobile_product_guard.py'
      - 'scripts/ci/teamwork_sniper_metadata.py'
      - 'scripts/ci/teamwork_sniper_guard.py'
      - 'scripts/ci/release_versions.py'
      - 'release/version.toml'
      - 'scripts/ci/tests/**'
      - 'scripts/agent/team/**'
      - '.github/workflows/_mobile-build.yml'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/teamwork-sniper/**'
      - '!apps/mobile/AGENTS.md'
      - '!apps/mobile/**/*.md'
      - 'third_party/mobilerun-portal'
      - 'third_party/mobilerun-portal/**'
      - '.gitmodules'
      - 'scripts/ci/mobile_metadata.py'
      - 'scripts/ci/mobile_product_guard.py'
      - 'scripts/ci/teamwork_sniper_metadata.py'
      - 'scripts/ci/teamwork_sniper_guard.py'
      - 'scripts/ci/release_versions.py'
      - 'release/version.toml'
      - 'scripts/ci/tests/**'
      - 'scripts/agent/team/**'
      - '.github/workflows/_mobile-build.yml'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    uses: ./.github/workflows/_mobile-build.yml
    permissions:
      contents: read
