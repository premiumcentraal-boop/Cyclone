name: Cyclone Mobile Backend

on:
  push:
    branches:
      - feature/mobile-mobilerun-backend
    paths:
      - "apps/cyclone-core/app/mobile_portal.py"
      - "apps/cyclone-core/app/mobile_gateway.py"
      - "apps/cyclone-core/app/settings.py"
      - "apps/cyclone-core/tests/test_mobile_portal.py"
      - "apps/cyclone-core/requirements.txt"
      - ".github/workflows/mobile-backend.yml"
  pull_request:
    paths:
      - "apps/cyclone-core/app/mobile_portal.py"
      - "apps/cyclone-core/app/mobile_gateway.py"
      - "apps/cyclone-core/app/settings.py"
      - "apps/cyclone-core/tests/test_mobile_portal.py"
      - "apps/cyclone-core/requirements.txt"
      - ".github/workflows/mobile-backend.yml"

jobs:
  test-mobile-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cyclone-core
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/cyclone-core/requirements.txt
      - name: Install Cyclone Core dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Test Mobilerun compatibility backend
        run: python -m pytest -q tests/test_mobile_portal.py
      - name: Import mobile gateway
        run: python -c "from app.mobile_gateway import app; assert app.title == 'Cyclone Mobile Gateway'"
