schema: cyclone-agent-project-v1
project: Cyclone
primary_direction: autonomous_android_phone_agent
mission: >-
  Let a user ask for phone goals or teach routines, then observe, understand,
  act, verify, learn, reuse and self-heal across Android apps.

working_line:
  product_version: "3.6.0"
  android_version_code: 43
  branch: release/beta/cyclone-3.6.0
  release_tag: v3.6.0
  default_branch_warning: main_may_still_be_3.5.1
  next_layer: V4_overlay_page_card_skill_os
  advertise_4_0_0: false_until_pixel_slices_1_4_green

canonical_docs:
  agent_rules: AGENTS.md
  hub: docs/agent-system/README.md
  working_line: docs/WORKING_LINE.md
  docs_map: docs/README.md
  fast_work: docs/agent-system/FAST_WORK_AND_TOKEN_PLAYBOOK.md
  current_state: docs/agent-system/CURRENT_STATE.md
  architecture: docs/agent-system/ARCHITECTURE_AND_CONTRACTS.md
  multi_agent: docs/agent-system/MULTI_AGENT_PROTOCOL.md
  releases: docs/agent-system/FAST_RELEASE_PLAYBOOK.md
  roadmap: docs/agent-system/AUTONOMY_ROADMAP.md
  v4_bible: docs/agent-system/V4_BUILD_BIBLE.md
  v4_directions: docs/agent-system/V4_DIRECTIONS.md
  v4_roadmap: docs/agent-system/V4_ROADMAP.md
  overlay: docs/design/mobile-v32/SUPER_APP_OVERLAY_HANDOFF.md
  mcp_skill: tools/codex-phone-mcp/SKILL.md
  decisions: docs/agent-system/DECISIONS.md
  infrastructure_v3: docs/agent-system/infrastructure-v3/README.md
  infrastructure_v3_adr: docs/agent-system/ADR_INFRASTRUCTURE_V3.md
  archived_root_handoffs:
    - docs/STATUS.md
    - docs/HANDOFF.md
    - docs/ARCHITECTURE.md
    - docs/CYCLONE_V2_5_APP_LEARNER_INTEGRATION_PLAN.md
    - docs/CYCLONE_V2_6_ARCHITECTURE.md
    - docs/CYCLONE_V2_7_ADAPTIVE_BRAIN.md
    - docs/CYCLONE_V2_8_PAGE_AWARE_AGENT_PLAN.md
    - docs/CYCLONE_V2_9_TEACHING.md

mobile:
  package: com.cyclone.mobile
  launcher: .MainActivity
  version_source: apps/mobile/app/build.gradle.kts#defaultConfig.versionName
  ui_version_adapter: apps/mobile/app/src/main/java/com/cyclone/mobile/CycloneRelease.kt
  product_surfaces:
    - Home
    - Teach
    - AI
    - Automations
    - Brain
    - Settings
  canonical_action_engine: apps/mobile/app/src/main/java/com/cyclone/mobile/PhoneToolExecutor.kt
  perception_service: apps/mobile/app/src/main/java/com/cyclone/mobile/CycloneAccessibilityService.kt

layers:
  android_control:
    paths:
      - apps/mobile/app/src/main/java/com/cyclone/mobile/CycloneAccessibilityService.kt
      - apps/mobile/app/src/main/java/com/cyclone/mobile/PhoneToolExecutor.kt
  page_learning:
    paths:
      - apps/mobile/app/src/main/java/com/cyclone/mobile/applearner
      - apps/mobile/app/src/main/java/com/cyclone/mobile/brain
  automation_teaching:
    paths:
      - apps/mobile/app/src/main/java/com/cyclone/mobile/automation
      - apps/mobile/app/src/main/java/com/cyclone/mobile/guided
  mobile_ai_ux:
    paths:
      - apps/mobile/app/src/main/java/com/cyclone/mobile/ai
      - apps/mobile/app/src/main/java/com/cyclone/mobile/ui
  android_gateway:
    paths:
      - apps/mobile/app/src/main/java/com/cyclone/mobile/gateway
  pc_gateway:
    paths:
      - apps/device-gateway
  codex_mcp:
    paths:
      - tools/codex-phone-mcp
      - scripts/phone-gateway
  desktop_core:
    note: legacy_control_plane_not_phone_dependency
    paths:
      - apps/cyclone-core
      - apps/desktop
      - apps/host-bridge
      - services
      - packages

infrastructure_v3:
  composition: apps/mobile/app/src/main/java/com/cyclone/mobile/infrastructure/v3
  ownership: docs/agent-system/infrastructure-v3/OWNERSHIP.md
  services:
    capability_registry:
      path: apps/mobile/app/src/main/java/com/cyclone/mobile/platform/capability
      authority: inventory_only
    policy_governor:
      path: apps/mobile/app/src/main/java/com/cyclone/mobile/policy
      authority: phone_action_authorization
    module_supervisor:
      path: apps/mobile/app/src/main/java/com/cyclone/mobile/platform/modules
      authority: module_lifecycle_and_quarantine
    memory:
      path: apps/mobile/app/src/main/java/com/cyclone/mobile/brain/memory
      authority: sole_policy_gated_write_seam
    context_ledger:
      path: apps/mobile/app/src/main/java/com/cyclone/mobile/observability
      authority: redacted_causal_event_persistence
    runtime_update:
      path: apps/mobile/app/src/main/java/com/cyclone/mobile/runtime/update
      authority: verify_and_stage_only
    recovery:
      path: apps/mobile/app/src/main/java/com/cyclone/mobile/runtime/recovery
      authority: runtime_promotion_rollback_and_safe_mode_decisions
    gateway:
      path: apps/device-gateway
      contract: cyclone.gateway.capability.v1
      authority: typed_transport_and_witness_adapter_only

invariants:
  - one_android_launcher
  - one_phone_mutation_engine
  - semantic_first_vision_fallback
  - verify_after_mutation
  - no_generic_model_shell_or_root
  - redact_sensitive_typed_values
  - physical_verification_distinct_from_ci
  - release_claim_requires_artifact_hash
  - one_module_lifecycle_authority
  - one_policy_authority
  - one_memory_write_seam
  - recovery_only_runtime_promotion_and_rollback
  - no_4_0_0_apk_before_pixel_slices_1_4

release:
  verified_marker_pattern: releases/<version>/BUILD_VERIFIED.json
  download_index: MOBILE_DOWNLOADS.md
  artifact_host: github_releases
  signing_currently_expected: PINNED_RELEASE_KEYSTORE
  authoritative_mobile_ci: .github/workflows/mobile-ci.yml
  reusable_mobile_build: .github/workflows/_mobile-build.yml
  release_artifact_reuse: .github/workflows/mobile-release.yml
  production_publication_enabled: true
  combined_beta_publication_enabled_on_release_push: true
  current_tag: v3.6.0

agent_bootstrap:
  command: python scripts/agent/cyclone-context.py --markdown
  first_read: docs/agent-system/FAST_WORK_AND_TOKEN_PLAYBOOK.md
  context_policy: root_rules_then_working_line_then_fast_playbook_then_one_owner_lane
  task_template: .github/ISSUE_TEMPLATE/agent-task.md
  pr_template: .github/PULL_REQUEST_TEMPLATE.md
